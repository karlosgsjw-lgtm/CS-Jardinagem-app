<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#123d2c">
<link rel="manifest" href="manifest.webmanifest">
<title>CS Jardinagem App</title>
<style>
:root{--bg:#f3f7f4;--card:#fff;--ink:#17352a;--muted:#718078;--line:#dfe9e3;--brand:#176b45;--brand2:#0f4f34;--shadow:0 12px 35px #17352a12;--red:#df3b3b;--yellow:#e5a900;--green:#26965a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#e5f3eb 0,transparent 34%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:linear-gradient(135deg,#103d2b,#1e8054);color:#fff;padding:24px 18px 28px;box-shadow:0 7px 25px #103d2b22}
.header-inner{max-width:1120px;margin:auto;display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:#ffffff18;display:grid;place-items:center;font-size:25px;backdrop-filter:blur(10px)}.brand{font-size:24px;font-weight:900;letter-spacing:-.5px}.sub{font-size:13px;opacity:.82;margin-top:2px}
nav{max-width:1120px;margin:-12px auto 0;position:relative;z-index:3;display:flex;gap:8px;padding:8px;background:#fffffff2;border:1px solid #ffffffaa;border-radius:16px;box-shadow:var(--shadow);overflow:auto}
nav button{border:0;background:transparent;color:#486258;padding:11px 16px;border-radius:11px;font-weight:800;white-space:nowrap;cursor:pointer}nav button.active{background:var(--brand);color:#fff}
main{max-width:1120px;margin:auto;padding:22px 16px 45px}.view{display:none}.view.active{display:block}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 18px}h2{margin:0;font-size:22px;letter-spacing:-.3px}.month{display:flex;align-items:center;gap:9px}.month h2{text-align:center;min-width:180px}.iconbtn{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;box-shadow:0 3px 10px #17352a0a}
.btn{border:0;background:linear-gradient(135deg,var(--brand),#21865a);color:#fff;padding:11px 16px;border-radius:12px;font-weight:850;cursor:pointer;box-shadow:0 5px 15px #176b4525}.btn.secondary{background:#edf4f0;color:var(--ink);box-shadow:none}.btn.danger{background:#fff0ef;color:#a92f2f;box-shadow:none}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{text-align:center;color:#829087;font-size:11px;font-weight:900;padding:4px;text-transform:uppercase}
.day{background:#fff;border:1px solid var(--line);border-radius:15px;min-height:145px;padding:9px;cursor:pointer;transition:.15s;box-shadow:0 2px 8px #17352a06}.day:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:#b8d2c4}.day.empty{background:transparent;border:0;box-shadow:none;cursor:default}.num{font-weight:900;font-size:13px;color:#51645b}.today .num{background:var(--brand);color:#fff;border-radius:9px;padding:4px 7px;display:inline-block}.events{display:flex;flex-direction:column;gap:5px;margin-top:7px}.event{border-radius:9px;padding:5px 6px;font-size:11px;line-height:1.2;font-weight:750;display:flex;gap:6px;align-items:flex-start;overflow:hidden}.event.red{background:#fff0ef;color:#9e3030}.event.yellow{background:#fff7dc;color:#8b6900}.event.green{background:#eaf8ef;color:#28744a}.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:2px}.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}.event-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.more{font-size:10px;color:var(--muted);font-weight:800;padding-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 4px 15px #17352a08;margin-bottom:12px}.search{padding:13px 14px;border:1px solid var(--line);border-radius:13px;width:100%;font:inherit;background:#fff;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#8bbba3;box-shadow:0 0 0 3px #176b4510}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #cfddd5;border-radius:11px;background:#fff;font:inherit;color:var(--ink);outline:none}textarea{min-height:100px;resize:vertical}label{font-size:12px;font-weight:900;display:block;margin:11px 0 6px;color:#53675e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.client{display:flex;justify-content:space-between;align-items:center;gap:14px}.client strong{font-size:16px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status{border:2px solid transparent;border-radius:12px;padding:12px 8px;text-align:center;font-weight:900;cursor:pointer}.status.selected{border-color:#17352a;box-shadow:0 4px 12px #17352a12}.status.r{background:#fff0ef;color:#a72d2d}.status.y{background:#fff7dc;color:#8b6900}.status.g{background:#eaf8ef;color:#28744a}
.modal{display:none;position:fixed;inset:0;background:#071c1488;z-index:20;padding:18px;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.modal.open{display:flex}.modalbox{background:#fff;border-radius:22px;padding:21px;max-width:610px;width:100%;max-height:91vh;overflow:auto;box-shadow:0 25px 70px #071c1440}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#edf3ef;border-radius:50%;width:34px;height:34px;font-size:20px;cursor:pointer}
.date-event{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.date-event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.pill.red{background:#ffe8e6;color:#a62f2f}.pill.yellow{background:#fff2c9;color:#876400}.pill.green{background:#e1f5e8;color:#246d45}
.history{border-left:3px solid #dce9e2;padding-left:12px;margin:12px 0}.emptymsg{text-align:center;padding:35px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:17px 0}
@media(max-width:700px){main{padding:17px 10px 35px}.calendar{gap:4px}.day{min-height:112px;padding:6px;border-radius:11px}.event{padding:5px;font-size:9px}.dow{font-size:9px}.month h2{min-width:150px;font-size:18px}.brand{font-size:21px}.statuses{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="logo">🌱</div><div><div class="brand">CS Jardinagem App</div><div class="sub">Sua agenda e histórico de jardinagem</div></div></div></header>
<nav><button class="active" data-view="agenda">📅 Agenda</button><button data-view="clientes">👤 Clientes</button><button data-view="usuarios">👥 Usuários</button></nav>
<main>
<section id="agenda" class="view active">
<div class="toolbar"><div class="month"><button class="iconbtn" id="prev">‹</button><h2 id="monthTitle"></h2><button class="iconbtn" id="next">›</button></div><button class="btn" onclick="openSchedule()">＋ Agendar</button></div>
<div class="calendar" id="calendar"></div>
</section>
<section id="clientes" class="view">
<div class="toolbar"><h2>Clientes</h2><button class="btn" onclick="openClient()">＋ Novo cliente</button></div>
<input class="search" id="search" placeholder="🔎 Pesquisar cliente..." oninput="renderClients"><br><br><div id="clientList"></div>
</section>
<section id="usuarios" class="view">
<div class="toolbar"><h2>Usuários</h2><button class="btn" onclick="openUser()">＋ Novo usuário</button></div>
<div class="card muted">Cadastre quem pode realizar os atendimentos. Carlos e Cláudia já estão cadastrados.</div><div id="userList"></div>
</section>
</main>
<div class="modal" id="modal"><div class="modalbox"><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lttqucegcmzwfsnrtdyj.supabase.co", SUPABASE_KEY="sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cur=new Date();cur.setDate(1),selectedStatus='green',currentUser=null,clients=[],events=[],profiles=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function iso(d){return d.toISOString().slice(0,10)}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR')}
function statusLabel(s){return {red:'Urgente',yellow:'Atenção',green:'Tudo certo'}[s]}
function statusIcon(s){return {red:'🔴',yellow:'🟡',green:'🟢'}[s]}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){showLogin();return}
  currentUser=session.user;
  await start();
}
function showLogin(){
  document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f3f7f4;font-family:system-ui">
  <div style="max-width:420px;width:100%;background:#fff;border:1px solid #dfe9e3;border-radius:24px;padding:30px;box-shadow:0 12px 35px #17352a12">
  <div style="font-size:48px;text-align:center">🌱</div><h1 style="text-align:center;color:#17352a">CS Jardinagem App</h1>
  <p style="text-align:center;color:#718078">Agenda, clientes e histórico na nuvem</p>
  <div id="err" style="display:none;background:#fff0ef;color:#9e3030;padding:10px;border-radius:10px"></div>
  <label>E-mail</label><input id="le" type="email" autocomplete="username" style="width:100%;padding:12px;border:1px solid #cfddd5;border-radius:11px;box-sizing:border-box">
  <label>Senha</label><input id="lp" type="password" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #cfddd5;border-radius:11px;box-sizing:border-box">
  <br><br><button onclick="login()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#176b45;color:white;font-weight:800">Entrar</button>
  </div></div>`;
}
async function login(){
  const e=document.getElementById('le').value.trim(),p=document.getElementById('lp').value;
  const r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error){const x=document.getElementById('err');x.textContent=r.error.message;x.style.display='block';return}
  location.reload();
}
async function logout(){await sb.auth.signOut();location.reload()}

async function start(){
  // Add the userbar to the existing polished header if needed.
  const header=document.querySelector('header');
  if(header && !document.getElementById('cloudUser')){
    const b=document.createElement('div');b.className='userbar';b.innerHTML='<span id="cloudUser"></span><button class="logout" onclick="logout()">Sair</button>';header.appendChild(b);
  }
  const p=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();
  const who=document.getElementById('cloudUser'); if(who)who.textContent='👤 '+(p.data?.nome||currentUser.email);
  await load();
}
async function load(){
  const [c,e,p]=await Promise.all([
    sb.from('clientes').select('*').order('nome'),
    sb.from('atendimentos').select('*').order('data_atendimento'),
    sb.from('profiles').select('*').order('nome')
  ]);
  if(c.error||e.error||p.error){alert('Erro ao carregar dados: '+(c.error||e.error||p.error).message);return}
  clients=c.data||[];events=e.data||[];profiles=p.data||[];
  renderCal();renderClients();renderUsers();
}
function renderCal(){
  const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  document.getElementById('monthTitle').textContent=cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  let h=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d),key=iso(date),ev=events.filter(e=>e.data_atendimento===key),today=key===iso(new Date())?' today':'';
    h+=`<div class="day${today}" onclick="openDate('${key}')"><div class="num">${d}</div><div class="events">`;
    ev.slice(0,5).forEach(e=>{let c=clients.find(x=>x.id===e.cliente_id);h+=`<div class="event ${e.situacao}" title="${esc(c?.nome||'Cliente')}"><i class="dot ${e.situacao}"></i><span class="event-text">${esc(c?.nome||'Cliente')}</span></div>`});
    if(ev.length>5)h+=`<div class="more">+ ${ev.length-5} atendimento(s)</div>`;
    h+='</div></div>';
  }
  document.getElementById('calendar').innerHTML=h;
}
function openDate(date){
  const ev=events.filter(e=>e.data_atendimento===date);
  const rows=ev.length?ev.map(e=>{let c=clients.find(x=>x.id===e.cliente_id),u=profiles.find(x=>x.id===e.responsavel_id);return `<div class="date-event"><div class="date-event-top"><span class="pill ${e.situacao}">${statusIcon(e.situacao)} ${statusLabel(e.situacao)}</span><button class="btn secondary" onclick="openSchedule('${date}',${e.id})">Editar</button></div><div style="margin-top:9px;font-weight:850">${esc(c?.nome||'Cliente')}</div><div style="margin-top:4px">${esc(e.nota||'Sem informação registrada')}</div><div class="muted" style="margin-top:5px">Responsável: ${esc(u?.nome||'—')}</div></div>`}).join(''):'<div class="emptymsg">Nenhum atendimento neste dia.</div>';
  document.getElementById('modalContent').innerHTML=`<div class="modalhead"><div><h2>📅 ${fmt(date)}</h2><div class="muted">Atendimentos agendados</div></div><button class="close" onclick="closeModal()">×</button></div><hr>${rows}<br><button class="btn" onclick="openSchedule('${date}')">＋ Adicionar atendimento</button>`;
  document.getElementById('modal').classList.add('open');
}
function openSchedule(date=iso(new Date()),editId=null){
  if(!clients.length){closeModal();alert('Cadastre o cliente primeiro em “Clientes”.');show('clientes');openClient();return}
  let old=events.find(e=>e.id===editId);selectedStatus=old?.situacao||'green';
  document.getElementById('modalContent').innerHTML=`<div class="modalhead"><div><h2>${editId?'Editar atendimento':'Novo atendimento'}</h2><div class="muted">Salvo automaticamente na nuvem.</div></div><button class="close" onclick="closeModal()">×</button></div>
  <label>Data</label><input type="date" id="evDate" value="${esc(old?.data_atendimento||date)}">
  <label>Cliente</label><select id="evClient">${clients.map(c=>`<option value="${c.id}" ${c.id===old?.cliente_id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
  <label>Responsável</label><select id="evUser">${profiles.filter(u=>u.ativo!==false).map(u=>`<option value="${u.id}" ${u.id===(old?.responsavel_id||currentUser.id)?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>
  <label>Situação</label><div class="statuses"><div class="status r ${selectedStatus==='red'?'selected':''}" onclick="pick('red',this)">🔴 Urgente</div><div class="status y ${selectedStatus==='yellow'?'selected':''}" onclick="pick('yellow',this)">🟡 Atenção</div><div class="status g ${selectedStatus==='green'?'selected':''}" onclick="pick('green',this)">🟢 Tudo certo</div></div>
  <label>Nota / informação</label><textarea id="evNote" placeholder="Ex.: Podou as ixoras e aplicou adubo...">${esc(old?.nota||'')}</textarea><br>
  <div class="actions"><button class="btn" onclick="saveEvent(${editId||0})">Salvar atendimento</button>${editId?`<button class="btn danger" onclick="deleteEvent(${editId})">Excluir</button>`:''}</div>`;
  document.getElementById('modal').classList.add('open');
}
function pick(s,el){selectedStatus=s;document.querySelectorAll('.status').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
async function saveEvent(id){
  const row={data_atendimento:evDate.value,cliente_id:+evClient.value,responsavel_id:evUser.value,situacao:selectedStatus,nota:evNote.value.trim()};
  if(!row.data_atendimento||!row.cliente_id)return alert('Preencha data e cliente.');
  const r=id?await sb.from('atendimentos').update(row).eq('id',id):await sb.from('atendimentos').insert(row);
  if(r.error)return alert('Erro ao salvar: '+r.error.message);
  closeModal();await load();
}
async function deleteEvent(id){if(!confirm('Excluir este atendimento?'))return;const r=await sb.from('atendimentos').delete().eq('id',id);if(r.error)return alert(r.error.message);closeModal();await load()}
function openClient(id=null){
  let c=clients.find(x=>x.id===id)||{nome:'',telefone:'',endereco:'',servico_principal:'',observacoes:''};
  document.getElementById('modalContent').innerHTML=`<div class="modalhead"><h2>${id?'Editar cliente':'Novo cliente'}</h2><button class="close" onclick="closeModal()">×</button></div>
  <label>Nome *</label><input id="cName" value="${esc(c.nome)}"><label>Telefone / WhatsApp</label><input id="cPhone" value="${esc(c.telefone)}"><label>Endereço</label><input id="cAddress" value="${esc(c.endereco)}"><label>Serviço principal</label><input id="cService" value="${esc(c.servico_principal)}" placeholder="Manutenção, poda, gramado..."><label>Observações</label><textarea id="cNotes">${esc(c.observacoes)}</textarea><br><button class="btn" onclick="saveClient(${id||0})">Salvar cliente</button>`;
  document.getElementById('modal').classList.add('open');
}
async function saveClient(id){
  const nome=cName.value.trim();if(!nome)return alert('Informe o nome.');
  const row={nome,telefone:cPhone.value,endereco:cAddress.value,servico_principal:cService.value,observacoes:cNotes.value};
  const r=id?await sb.from('clientes').update(row).eq('id',id):await sb.from('clientes').insert(row);
  if(r.error)return alert('Erro ao salvar: '+r.error.message);closeModal();await load();
}
function renderClients(){
  const q=(document.getElementById('search')?.value||'').toLowerCase(),arr=clients.filter(c=>c.nome.toLowerCase().includes(q));
  document.getElementById('clientList').innerHTML=arr.length?arr.map(c=>`<div class="card"><div class="client"><div><strong>👤 ${esc(c.nome)}</strong><div class="muted">${esc(c.telefone||'Sem telefone')} · ${esc(c.endereco||'Sem endereço')}</div></div><div class="actions"><button class="btn secondary" onclick="openClient(${c.id})">Editar</button><button class="btn" onclick="showHistory(${c.id})">Histórico</button></div></div></div>`).join(''):'<div class="emptymsg">Nenhum cliente cadastrado.</div>';
}
function showHistory(id){
  const c=clients.find(x=>x.id===id),ev=events.filter(e=>e.cliente_id===id).sort((a,b)=>b.data_atendimento.localeCompare(a.data_atendimento));
  document.getElementById('modalContent').innerHTML=`<div class="modalhead"><h2>📖 ${esc(c.nome)}</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">${esc(c.servico_principal||'')} ${c.telefone?'· '+esc(c.telefone):''}</p><p>${esc(c.observacoes||'')}</p><hr>${ev.length?ev.map(e=>{let u=profiles.find(x=>x.id===e.responsavel_id);return `<div class="history"><b>${fmt(e.data_atendimento)} · ${statusIcon(e.situacao)} ${statusLabel(e.situacao)}</b><div style="margin-top:4px">${esc(e.nota||'Sem observação')}</div><small class="muted">Responsável: ${esc(u?.nome||'—')}</small></div>`}).join(''):'<div class="emptymsg">Ainda não há atendimentos registrados.</div>'}`;
  document.getElementById('modal').classList.add('open');
}
function renderUsers(){document.getElementById('userList').innerHTML=profiles.map(u=>`<div class="card"><strong>👤 ${esc(u.nome)}</strong><div class="muted">${u.ativo===false?'Inativo':'Ativo'}</div></div>`).join('')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='agenda')renderCal();if(v==='clientes')renderClients();if(v==='usuarios')renderUsers()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
document.getElementById('search').addEventListener('input',renderClients);
document.getElementById('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);renderCal()};
document.getElementById('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);renderCal()};
boot();
</script>
