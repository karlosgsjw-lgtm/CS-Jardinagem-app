function scheduleAndroidNotifications(){try{if(!window.AndroidNotifications)return;let now=new Date(),limit=new Date(now);limit.setDate(limit.getDate()+60);let data=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())&&d<=limit}).map(a=>({id:a.id,date:a.data_atendimento,client:a.clientes?.nome||'Cliente',value:Number(a.valor_servico??a.valor??0)}));let end=new Date(now.getFullYear(),now.getMonth()+1,0,18,0,0,0);let unpaid=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&!a.pago}).map(a=>({id:a.id,date:a.data_atendimento,client:a.clientes?.nome||'Cliente',value:Number(a.valor_servico??a.valor??0)}));if(end>now)data.push({type:'monthEnd',id:900000+now.getFullYear()*12+now.getMonth(),date:iso(end),client:'',value:0,unpaid:unpaid});window.AndroidNotifications.scheduleNotifications(JSON.stringify(data))}catch(e){console.warn('Notificações Android:',e)}}

let moneyVisibilityHidden=false;
function applyMoneyVisibility(){
  const root=$('content'); if(!root)return;
  root.querySelectorAll('.moneyValueHidden').forEach(el=>{const t=document.createTextNode(el.dataset.original||el.textContent||'');el.replaceWith(t)});
  if(!moneyVisibilityHidden)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement; if(!p||p.closest('script,style,input,textarea,select,.tabSearch'))return NodeFilter.FILTER_REJECT;
    return /R\$\s*[0-9]/.test(node.nodeValue||'')?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;
  }});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const text=node.nodeValue||'';const parts=text.split(/(R\$\s*[0-9][0-9.,]*)/g);const frag=document.createDocumentFragment();parts.forEach((part,i)=>{if(/^R\$\s*[0-9]/.test(part)){const span=document.createElement('span');span.className='moneyValueHidden';span.dataset.original=part;span.textContent='R$ ••••';frag.appendChild(span)}else if(part)frag.appendChild(document.createTextNode(part))});node.parentNode?.replaceChild(frag,node)});
}
window.toggleMoneyVisibility=function(){moneyVisibilityHidden=!moneyVisibilityHidden;applyMoneyVisibility();document.querySelectorAll('.privacyToggle').forEach(b=>{b.textContent=moneyVisibilityHidden?'👁️ Mostrar valores':'🙈 Ocultar valores'});};
function addTabSearch(tabName){
  const content=$('content'); if(!content)return;
  const old=content.querySelector('.tabSearch'); if(old)old.remove();
  const labels={inicio:'Pesquisar na agenda...',anual:'Pesquisar na agenda anual...',clientes:'Pesquisar clientes...',ajudantes:'Pesquisar ajudantes...',financeiro:'Pesquisar no financeiro...',emissao:'Pesquisar nesta emissão...',usuarios:'Pesquisar usuários...'};
  const wrap=document.createElement('div');
  wrap.className='tabSearch';
  wrap.innerHTML=`<span class="searchIcon">🔎</span><input id="tabSearchInput" type="search" placeholder="${labels[tabName]||'Pesquisar nesta aba...'}" autocomplete="off" oninput="filterCurrentTab(this.value,'${tabName}')">`;
  content.insertBefore(wrap,content.firstChild);
}

function normSearch(v){
  return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
}
function searchHas(v,q){return normSearch(v).includes(q)}
function setSearchNotice(show){
  let n=$('tabSearchNoResults');
  if(show){
    if(!n){n=document.createElement('div');n.id='tabSearchNoResults';n.className='notice';n.style.margin='8px 0 12px';n.textContent='Nenhum resultado encontrado.';const c=$('content');c?.querySelector('.tabSearch')?.after(n)}
  }else if(n)n.remove();
}
window.filterCurrentTab=function(value,tabName){
  const q=normSearch(value), content=$('content');
  if(!content)return;
  setSearchNotice(false);
  if(!q){
    if(tabName==='inicio') content.querySelectorAll('.calendar .day').forEach(el=>el.style.display='');
    else if(tabName==='clientes'||tabName==='usuarios') content.querySelectorAll('.table tr').forEach(el=>el.style.display='');
    else if(tabName==='ajudantes') content.querySelectorAll('.infoLine,.helperPayRow').forEach(el=>el.style.display='');
    else if(tabName==='financeiro') content.querySelectorAll('.unpaidRow,.infoLine').forEach(el=>el.style.display='');
    else if(tabName==='anual') content.querySelectorAll('.infoLine').forEach(el=>el.style.display='');
    else if(tabName==='emissao') content.querySelectorAll('.emissaoItem').forEach(el=>el.style.display='');
    else content.querySelectorAll('.panel,.row,.infoLine,.table tr').forEach(el=>{if(!el.closest('.tabSearch'))el.style.display=''});
    return;
  }

  let found=0;
  if(tabName==='inicio'){
    const y=month.getFullYear(),m=month.getMonth();
    content.querySelectorAll('.calendar .day').forEach(el=>{
      const ds=el.dataset.date;
      let match=false;
      if(ds){
        const dd=new Date(ds+'T12:00:00');
        if(dd.getFullYear()!==y||dd.getMonth()!==m){el.style.display='none';return;}
        const list=appts.filter(a=>a.data_atendimento===ds);
        const plans=plannedForDate(ds);
        match=list.some(a=>searchHas(a.clientes?.nome,q)||searchHas(a.nota,q)||searchHas(a.data_atendimento,q)) ||
              plans.some(a=>searchHas(a.clientes?.nome,q)||searchHas(clients.find(c=>c.id===a.cliente_id)?.nome,q)||searchHas(a.observacao,q));
      }else match=searchHas(el.textContent,q);
      el.style.display=match?'':'none';
      if(match)found++;
    });
    setSearchNotice(found===0); return;
  }

  if(tabName==='clientes'){
    const rows=[...content.querySelectorAll('.table tr')].slice(1);
    rows.forEach((row,i)=>{
      const c=clients[i];
      const match=c?(
        searchHas(c.nome,q)||searchHas(c.telefone,q)||searchHas(c.endereco,q)||
        searchHas(c.servico_principal,q)||searchHas(c.observacoes,q)
      ):searchHas(row.textContent,q);
      row.style.display=match?'':'none';
      if(match)found++;
    });
    setSearchNotice(found===0); return;
  }

  if(tabName==='ajudantes'){
    const cadastro=[...content.querySelectorAll('.panel')].find(p=>normSearch(p.querySelector('h3')?.textContent)==='cadastro de ajudantes');
    if(cadastro){
      cadastro.querySelectorAll('.infoLine').forEach(row=>{
        const match=searchHas(row.textContent,q); row.style.display=match?'':'none'; if(match)found++;
      });
    }
    const pay=[...content.querySelectorAll('.helperPayRow')];
    pay.forEach(row=>{const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    setSearchNotice(found===0); return;
  }

  if(tabName==='financeiro'){
    content.querySelectorAll('.unpaidRow').forEach(row=>{const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    content.querySelectorAll('.infoLine').forEach(row=>{if(row.closest('.unpaidRow'))return;const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    setSearchNotice(found===0); return;
  }

  if(tabName==='anual'){
    content.querySelectorAll('.infoLine').forEach(row=>{const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    setSearchNotice(found===0); return;
  }

  if(tabName==='emissao'){
    content.querySelectorAll('.emissaoItem').forEach(row=>{const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    setSearchNotice(found===0); return;
  }

  if(tabName==='usuarios'){
    content.querySelectorAll('.table tr').forEach((row,i)=>{if(i===0)return;const match=searchHas(row.textContent,q);row.style.display=match?'':'none';if(match)found++});
    setSearchNotice(found===0); return;
  }

  content.querySelectorAll('.panel,.row,.infoLine,.table tr').forEach(el=>{
    if(el.closest('.tabSearch')||el.closest('#tabSearchNoResults'))return;
    const match=searchHas(el.textContent,q);el.style.display=match?'':'none';if(match)found++;
  });
  setSearchNotice(found===0);
}

function globalResultHtml(type,title,sub,action){return `<div class="globalResult" onclick="${action}"><b>${esc(title)}</b><small>${esc(sub)}</small></div>`}
window.globalSearch=async function(q){
  q=String(q||'').trim().toLocaleLowerCase('pt-BR'); const box=$('globalResults'); if(!box)return;
  if(q.length<2){box.innerHTML='<span class="muted small">Digite pelo menos 2 caracteres.</span>';return}
  let out=[];
  const has=v=>String(v??'').toLocaleLowerCase('pt-BR').includes(q);
  clients.filter(c=>has(c.nome)||has(c.telefone)||has(c.endereco)||has(c.servico_principal)||has(c.observacoes)).slice(0,15).forEach(c=>out.push(globalResultHtml('cliente',c.nome,'Cliente · '+(c.servico_principal||'Cadastro'),`closeGlobalSearch();openClient(${c.id})`)));
  appts.filter(a=>has(a.clientes?.nome)||has(a.nota)||has(a.data_atendimento)||has(a.valor_servico??a.valor)).slice(0,20).forEach(a=>out.push(globalResultHtml('atendimento',a.clientes?.nome||'Cliente',new Date(a.data_atendimento+'T12:00:00').toLocaleDateString('pt-BR')+' · '+money(a.valor_servico??a.valor),`closeGlobalSearch();viewAppointment(${a.id})`)));
  helperList.filter(h=>has(h.nome)||has(h.telefone)||has(h.pix)||has(h.observacoes)).slice(0,10).forEach(h=>out.push(globalResultHtml('ajudante',h.nome,'Ajudante',`closeGlobalSearch();tab('ajudantes')`)));
  annuals.filter(x=>has(x.data_agendada)||has(x.observacao)||has(clients.find(c=>c.id===x.cliente_id)?.nome)).slice(0,10).forEach(x=>out.push(globalResultHtml('anual',clients.find(c=>c.id===x.cliente_id)?.nome||'Cliente',new Date(x.data_agendada+'T12:00:00').toLocaleDateString('pt-BR')+' · Agenda anual',`closeGlobalSearch();openAnnual(${x.cliente_id},${new Date(x.data_agendada+'T12:00:00').getFullYear()})`)));
  try{let r=await dbClient.from('cliente_fotos').select('id,cliente_id,descricao').ilike('descricao','%'+q+'%').limit(10);if(!r.error)(r.data||[]).forEach(x=>out.push(globalResultHtml('foto',clients.find(c=>c.id===x.cliente_id)?.nome||'Cliente','Foto · '+(x.descricao||'Sem descrição'),`closeGlobalSearch();openClient(${x.cliente_id})`)))}catch(e){}
  if(profile?.perfil==='master'){try{let r=await dbClient.from('profiles').select('id,nome,ativo,perfil').ilike('nome','%'+q+'%').limit(10);if(!r.error)(r.data||[]).forEach(x=>out.push(globalResultHtml('usuario',x.nome||'Usuário','Usuário · '+(x.perfil==='master'?'Master':'Usuário'),`closeGlobalSearch();tab('usuarios')`)))}catch(e){}}
  box.innerHTML=out.length?out.slice(0,40).join(''):'<span class="muted small">Nenhum resultado encontrado.</span>';
};

function plannedForDate(ds){return annuals.filter(x=>x.data_agendada===ds)}
function agenda(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=[];for(let i=0;i<42;i++)days.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));let names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],today=iso(new Date()),ma=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}),earned=ma.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0),open=ma.filter(a=>!a.pago).reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
$('content').innerHTML=`<div class="toolbar agendaToolbar"><h2 style="margin:0">Agenda</h2><button type="button" class="btn alt privacyToggle" onclick="toggleMoneyVisibility()">🙈 Ocultar valores</button><div class="toolbarMetrics"><div class="compactStats"><div class="compactStat"><span class="statIcon">📋</span><div><span class="statLabel">Atendimentos</span><b>${ma.length}</b></div></div><div class="compactStat"><span class="statIcon">💰</span><div><span class="statLabel">Serviço mês</span><b>${money(earned)}</b></div></div><div class="compactStat"><span class="statIcon">🔴</span><div><span class="statLabel">Em aberto</span><b>${money(open)}</b></div></div></div><button type="button" class="btn agendarBtn" aria-label="Agendar" title="Agendar novo atendimento" onclick="newAppt()">+</button></div></div><div class="calendarHead"><button class="btn alt" onclick="changeMonth(-1)">‹</button><h2>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month)}</h2><button class="btn alt" onclick="changeMonth(1)">›</button></div><div class="calendar">${days.map(d=>{let ds=iso(d),list=appts.filter(a=>a.data_atendimento===ds),pl=plannedForDate(ds).filter(x=>!list.some(a=>a.cliente_id===x.cliente_id));return `<div class="day ${d.getMonth()!==m?'other':''} ${ds===today?'today':''}" data-date="${ds}" onclick="dayDetails('${ds}')"><div class="dow">${names[d.getDay()]} <span id="wx-${ds}" class="weatherIcon"></span></div><div class="num">${d.getDate()}</div>${list.map(a=>`<div class="appt"><span class="dot ${dot(a.situacao)}"></span>${esc(a.clientes?.nome||'Cliente')}${a.pago?' ✓':''}</div>`).join('')}${pl.map(x=>`<div class="appt" style="border:1px dashed #ef4444"><span class="dot red"></span>${esc(x.clientes?.nome||clients.find(c=>c.id===x.cliente_id)?.nome||'Cliente')} <span class="small">anual</span></div>`).join('')}${list.length+pl.length?'':'<span class="muted small">Livre</span>'}</div>`}).join('')}</div>`;weather()}
window.changeMonth=n=>{month.setMonth(month.getMonth()+n);agenda()};
let forecast={};async function weather(){forecast={};try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.6677&longitude=-46.4614&daily=weather_code&timezone=America%2FSao_Paulo&forecast_days=16');let j=await r.json();j.daily.time.forEach((d,i)=>forecast[d]=weatherIcon(j.daily.weather_code[i]));document.querySelectorAll('[id^="wx-"]').forEach(e=>e.textContent=forecast[e.id.slice(3)]||'')}catch(e){}}
function weatherIcon(c){if(c===0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}
window.dayDetails=ds=>{let list=appts.filter(a=>a.data_atendimento===ds),pl=plannedForDate(ds).filter(x=>!list.some(a=>a.cliente_id===x.cliente_id));openModal(`<h2>📅 ${new Date(ds+'T12:00:00').toLocaleDateString('pt-BR')}</h2><button class="btn" onclick="openAppt(null,'${ds}')">+ Incluir cliente neste dia</button>${list.map(a=>`<div class="panel"><div class="row"><b>${esc(a.clientes?.nome||'Cliente')}</b><span class="dot ${dot(a.situacao)}"></span><span>${a.pago?'Pago':'Não pago'}</span><span class="right">${money(a.valor_servico??a.valor)}</span></div><p class="muted">${esc(a.nota||'Sem observação')}</p><div class="row"><button class="btn" onclick="openAppt(${a.id})">✏️ Editar</button><button class="btn alt" onclick="viewAppointment(${a.id})">👁️ Visualizar</button><button class="btn danger" onclick="deleteAppointment(${a.id},'${ds}')">🗑️ Excluir</button></div></div>`).join('')}${pl.map(x=>{let c=clients.find(c=>c.id===x.cliente_id);return `<div class="panel"><div class="row"><b>🗓️ ${esc(c?.nome||'Cliente')}</b><span class="right">Planejado na Agenda Anual</span></div><div class="row"><button class="btn" onclick="openAppt(null,'${ds}',${x.cliente_id})">Abrir atendimento</button><button class="btn danger" onclick="deleteAnnualDate(${x.id},${x.cliente_id},${new Date(ds+'T12:00:00').getFullYear()})">🗑️ Excluir data</button></div></div>`}).join('')}${!list.length&&!pl.length?'<p class="muted">Nenhum atendimento.</p>':''}`)};

async function getPhotos(clienteId){try{let r=await dbClient.from('cliente_fotos').select('id,cliente_id,imagem_data,descricao,criado_em').eq('cliente_id',clienteId).order('criado_em',{ascending:false});if(r.error){console.warn('Erro ao carregar fotos:',r.error.message);return []}return r.data||[]}catch(e){console.warn('Erro ao carregar fotos:',e);return []}}
let photoZoomState={scale:1,x:0,y:0,startScale:1,startDist:0,startX:0,startY:0,baseX:0,baseY:0};
function applyPhotoZoom(){const img=$('photoViewerImg');if(!img)return;img.style.transform=`translate(${photoZoomState.x}px,${photoZoomState.y}px) scale(${photoZoomState.scale})`}
function photoTouchDistance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
window.viewPhoto=(src,desc='')=>{let v=$('photoViewer');let img=$('photoViewerImg');img.src=src;img.classList.add('photoZoomImg');$('photoViewerCaption').textContent=desc||'Foto do cliente';photoZoomState={scale:1,x:0,y:0,startScale:1,startDist:0,startX:0,startY:0,baseX:0,baseY:0};applyPhotoZoom();v.classList.remove('hidden')};
window.closePhotoViewer=()=>{let v=$('photoViewer');v.classList.add('hidden');let img=$('photoViewerImg');img.src='';img.style.transform='';};
document.addEventListener('touchstart',e=>{const img=$('photoViewerImg');if(!img||$('photoViewer')?.classList.contains('hidden')||e.target!==img)return;if(e.touches.length===2){photoZoomState.startDist=photoTouchDistance(e.touches);photoZoomState.startScale=photoZoomState.scale;photoZoomState.startX=0;photoZoomState.startY=0;e.preventDefault()}else if(e.touches.length===1){photoZoomState.startX=e.touches[0].clientX;photoZoomState.startY=e.touches[0].clientY;photoZoomState.baseX=photoZoomState.x;photoZoomState.baseY=photoZoomState.y}}, {passive:false});
document.addEventListener('touchmove',e=>{const img=$('photoViewerImg');if(!img||$('photoViewer')?.classList.contains('hidden')||e.target!==img)return;if(e.touches.length===2&&photoZoomState.startDist){const next=Math.max(1,Math.min(5,photoZoomState.startScale*(photoTouchDistance(e.touches)/photoZoomState.startDist)));photoZoomState.scale=next;applyPhotoZoom();e.preventDefault()}else if(e.touches.length===1&&photoZoomState.scale>1){photoZoomState.x=photoZoomState.baseX+(e.touches[0].clientX-photoZoomState.startX);photoZoomState.y=photoZoomState.baseY+(e.touches[0].clientY-photoZoomState.startY);applyPhotoZoom();e.preventDefault()}},{passive:false});
document.addEventListener('touchend',e=>{if(e.touches.length<2)photoZoomState.startDist=0});

window.deletePhoto=async(id,after='appt')=>{if(!confirm('Excluir esta foto e a descrição?'))return;let r=await dbClient.from('cliente_fotos').delete().eq('id',id);if(r.error)return alert(r.error.message);if(after==='client'&&window.currentClientEditId)openClient(window.currentClientEditId);else if(after==='appt'&&window.currentApptClientId)refreshApptPhotos();else if(after==='view'&&window.currentViewAppointmentId)viewAppointment(window.currentViewAppointmentId)};
function photoCard(x,mode='view'){return `<div class="photo"><img src="${x.imagem_data}" alt="foto" onclick="viewPhoto('${x.imagem_data}','${esc(x.descricao||'Sem descrição').replace(/'/g,"&#39;")}')"><div class="small">${esc(x.descricao||'Sem descrição')}</div>${(mode==='edit'||mode==='appt')?`<div class="photoActions"><button type="button" class="btn danger photoDelete" onclick="deletePhoto(${x.id},'${mode==='edit'?'client':'appt'}')">🗑️ Excluir</button></div>`:''}</div>`}

window.previewPhotoFile=async function(inputId,previewId){
  const input=document.getElementById(inputId), preview=document.getElementById(previewId);
  if(!input||!preview)return;
  const f=input.files?.[0];
  if(!f){preview.innerHTML=''; return;}
  if(!f.type.startsWith('image/')){input.value='';preview.innerHTML='<span class="muted">Selecione uma imagem válida.</span>';return;}
  const rd=new FileReader();
  rd.onload=()=>{
    preview.innerHTML=`<div class="pendingPhoto"><img src="${rd.result}" alt="Pré-visualização"><span>Foto selecionada — clique em “Incluir foto” para salvar.</span></div>`;
  };
  rd.readAsDataURL(f);
};
window.fileToDataUrl=async function(file,maxSide=1600,quality=.82){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onerror=reject;
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.naturalWidth*scale)); c.height=Math.max(1,Math.round(img.naturalHeight*scale));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject; img.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
};

window.openCamera=async(mode,id=null)=>{
  if(mode==='client'&&!id)return alert('Salve o cliente primeiro para tirar uma foto.');
  cameraTarget=mode; cameraClientId=id||Number(document.getElementById('ac')?.value||0); cameraPendingData=null;
  const cm=document.getElementById('cameraModal'),v=document.getElementById('cameraVideo'),msg=document.getElementById('cameraMsg');
  if(!navigator.mediaDevices?.getUserMedia)return alert('A câmera deste dispositivo/navegador não está disponível. Use “Escolher da galeria”.');
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    v.srcObject=cameraStream; msg.textContent='Posicione a câmera e toque em “Capturar foto”.'; cm.classList.remove('hidden');
  }catch(e){alert('Não foi possível acessar a câmera. Verifique a permissão da câmera e tente novamente.');}
};
window.closeCamera=()=>{if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}const v=document.getElementById('cameraVideo');if(v)v.srcObject=null;document.getElementById('cameraModal')?.classList.add('hidden');cameraTarget=null;cameraClientId=null};
window.captureCameraPhoto=async()=>{
  const v=document.getElementById('cameraVideo'); if(!v?.videoWidth)return alert('A câmera ainda não está pronta. Aguarde um instante.');
  const canvas=document.createElement('canvas'); const max=1600; const scale=Math.min(1,max/v.videoWidth); canvas.width=Math.round(v.videoWidth*scale); canvas.height=Math.round(v.videoHeight*scale); canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
  cameraPendingData=canvas.toDataURL('image/jpeg',0.86);
  const target=cameraTarget;
  closeCamera();
  const previewId=target==='client'?'photoPreview':'apptPhotoPreview';
  const descId=target==='client'?'photoDesc':'apptPhotoDesc';
  const preview=document.getElementById(previewId);
  if(preview) preview.innerHTML=`<div class=\"pendingPhoto\"><img src=\"${cameraPendingData}\" alt=\"Foto capturada\"><span><b>Foto capturada.</b> Agora escreva a descrição abaixo e toque em “Adicionar foto” ou “Incluir foto”.</span></div>`;
  const desc=document.getElementById(descId);
  if(desc){desc.focus();desc.scrollIntoView({behavior:'smooth',block:'center'});}
};

window.deleteClient=async function(id){
  let c=clients.find(x=>String(x.id)===String(id));
  if(!c)return;
  if(!confirm('Excluir o cliente '+c.nome+'?\n\nIsso também excluirá os atendimentos, fotos e datas da Agenda Anual deste cliente. Esta ação não pode ser desfeita.'))return;
  let steps=[
    dbClient.from('cliente_fotos').delete().eq('cliente_id',id),
    dbClient.from('agendas_anuais').delete().eq('cliente_id',id),
    dbClient.from('atendimentos').delete().eq('cliente_id',id)
  ];
  for(const q of steps){let r=await q;if(r.error){alert('Não foi possível excluir o cliente.\n\n'+r.error.message);return}}
  let r=await dbClient.from('clientes').delete().eq('id',id);
  if(r.error){alert('Não foi possível excluir o cliente.\n\n'+r.error.message);return}
  await loadData();clientPage();
};

function financePage(){
  let now=new Date(), day=(now.getDay()+6)%7, mon=new Date(now); mon.setHours(12,0,0,0); mon.setDate(now.getDate()-day);
  let sun=new Date(mon); sun.setDate(mon.getDate()+6);
  let w1=iso(mon), w2=iso(sun);
  let y=month.getFullYear(),m=month.getMonth();
  let arr=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m});
  let earned=arr.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
  let received=arr.filter(a=>a.pago).reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
  let help=arr.reduce((s,a)=>s+[1,2,3,4,5].reduce((z,i)=>z+Number(a['ajudante_'+i+'_valor']||0),0),0);
  let worked={};
  appts.filter(a=>a.data_atendimento>=w1&&a.data_atendimento<=w2).forEach(a=>{for(let i=1;i<=5;i++){let hid=a['ajudante_'+i+'_id'];if(hid)worked[hid]=(worked[hid]||0)+Number(a['ajudante_'+i+'_valor']||0)}});
  let owedRows=helperList.filter(h=>worked[h.id]).map(h=>({h,v:Number(worked[h.id]||0)})).filter(x=>!helperPayments.some(p=>String(p.ajudante_id)===String(x.h.id)&&p.semana_inicio===w1&&p.pago));
  let owedTotal=owedRows.reduce((s,x)=>s+x.v,0);
  let unpaid=appts.filter(a=>!a.pago).sort((a,b)=>String(a.data_atendimento).localeCompare(String(b.data_atendimento)));
  let unpaidTotal=unpaid.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
  let payErr=window.helperPayLoadError?`<div class="notice"><b>Pagamento dos ajudantes:</b> ${esc(window.helperPayLoadError)}<br><span class="small">Execute o SQL da tabela de pagamentos dos ajudantes no Supabase.</span></div>`:'';
  $('content').innerHTML=`<div class="toolbar financeToolbar"><h2>💰 Financeiro</h2><button type="button" class="btn alt privacyToggle" onclick="toggleMoneyVisibility()">🙈 Ocultar valores</button><div class="compactStats"><div class="compactStat"><span class="statIcon">💰</span><div><span class="statLabel">Serviços no mês</span><b>${money(earned)}</b></div></div><div class="compactStat"><span class="statIcon">✅</span><div><span class="statLabel">Recebido</span><b>${money(received)}</b></div></div><div class="compactStat"><span class="statIcon">👷</span><div><span class="statLabel">Ajudantes no mês</span><b>${money(help)}</b></div></div></div></div>${payErr}<div class="panel"><h3>👷 A pagar aos ajudantes nesta semana</h3><p class="muted small">${mon.toLocaleDateString('pt-BR')} até ${sun.toLocaleDateString('pt-BR')}</p>${owedRows.map(x=>`<div class="helperPayRow"><div class="helperPayInfo"><b>${esc(x.h.nome)}</b><div class="small muted">${money(x.v)}</div></div><label class="helperPayCheck"><input type="checkbox" onchange="confirmHelperPaid(this,${x.h.id},'${w1}','${w2}')"><span>Pago</span></label></div>`).join('')||'<p class="muted">Nenhum ajudante pendente de pagamento nesta semana.</p>'}<div class="row financeTotal"><b>Total a pagar</b><b class="right">${money(owedTotal)}</b></div></div><div class="panel"><h3>🔴 Clientes que ainda não pagaram</h3><p class="muted small">Todo atendimento não marcado como pago aparece aqui. Clique na caixinha para confirmar o pagamento. O cliente só sai da lista depois da confirmação.</p>${unpaid.map(a=>{let c=clients.find(x=>x.id===a.cliente_id);return `<div class="row infoLine unpaidRow"><div><b>${esc(c?.nome||'Cliente')}</b><div class="small muted">${new Date(a.data_atendimento+'T12:00:00').toLocaleDateString('pt-BR')} · ${esc(a.nota||'Serviço')}</div></div><div class="right unpaidActions"><b>${money(a.valor_servico??a.valor??0)}</b><label class="payCheck"><input type="checkbox" onchange="confirmAppointmentPaid(this,${a.id})"><span>Marcar como pago</span></label></div></div>`}).join('')||'<p class="muted">🎉 Nenhum cliente em aberto.</p>'}<div class="row financeTotal"><b>Total em aberto</b><b class="right">${money(unpaidTotal)}</b></div></div><div class="panel"><b>Líquido após ajudantes no mês: ${money(earned-help)}</b></div>`;
}
window.confirmHelperPaid=async function(box,helperId,weekStart,weekEnd){
  if(!box.checked)return;
  let h=helperList.find(x=>String(x.id)===String(helperId));
  let ok=confirm('Tem certeza que já pagou '+(h?.nome||'este ajudante')+'?');
  if(!ok){box.checked=false;return}
  box.disabled=true;
  let r=await dbClient.from('pagamentos_ajudantes').upsert({ajudante_id:helperId,semana_inicio:weekStart,semana_fim:weekEnd,pago:true,pago_em:new Date().toISOString(),pago_por:me?.id||null},{onConflict:'ajudante_id,semana_inicio,semana_fim'});
  if(r.error){box.disabled=false;box.checked=false;alert('Não foi possível registrar o pagamento.\n\n'+r.error.message);return}
  await loadData();financePage();
};
window.confirmAppointmentPaid=async function(box,id){if(!box.checked)return;let ok=confirm('Tem certeza que já foi pago?');if(!ok){box.checked=false;return}box.disabled=true;let r=await dbClient.from('atendimentos').update({pago:true,pago_em:new Date().toISOString()}).eq('id',id);if(r.error){box.disabled=false;box.checked=false;return alert('Não foi possível marcar como pago.\n\n'+r.error.message)}await loadData();scheduleAndroidNotifications();financePage()};window.markAppointmentPaid=window.confirmAppointmentPaid;

window.emissaoSelectClient=function(){let id=Number($('emCli')?.value||0),c=clients.find(x=>x.id===id);if(!c)return;$('emNome').value=c.nome||'';$('emEnd').value=c.endereco||'';emissaoLoadServices()};

window.emissaoAddService=function(){let box=$('emRows');if(!box)return;let item=document.createElement('div');item.className='emissaoItem';item.innerHTML=`<div class="grid3"><div><label>Data</label><input class="field emDate" type="date" value="${iso(new Date())}"></div><div><label>Serviço realizado</label><input class="field emDesc" value="Serviço de jardinagem"></div><div><label>Valor</label><input class="field moneyInput emVal" value="0,00" oninput="formatMoneyInput(this);emissaoTotal()"></div></div><button class="btn danger" style="margin-top:8px" onclick="this.closest('.emissaoItem').remove();emissaoTotal()">🗑️ Remover da emissão</button>`;if(box.querySelector('.muted'))box.innerHTML='';box.appendChild(item);emissaoTotal()};
window.formatMoneyInput=function(el){if(!el)return;let raw=String(el.value||'').replace(/\D/g,'');let n=Number(raw||0)/100;el.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
window.emissaoTotal=function(){let total=0;document.querySelectorAll('.emVal').forEach(x=>total+=parseMoney(x.value));let e=$('emTotal');if(e)e.textContent=money(total);return total};
window.emissaoPrint=function(){let nome=$('emNome')?.value.trim(),end=$('emEnd')?.value.trim(),mes=$('emMes')?.value||'',venc=$('emVenc')?.value||'',frase=$('emFrase')?.value||'',forma=$('emForma')?.value||'',obs=$('emObs')?.value||'';if(!nome)return alert('Informe ou selecione a empresa/cliente.');let itens=[...document.querySelectorAll('.emissaoItem')].map(x=>({data:x.querySelector('.emDate')?.value||'',desc:x.querySelector('.emDesc')?.value||'',valor:parseMoney(x.querySelector('.emVal')?.value||0)}));if(!itens.length)return alert('Adicione pelo menos um serviço.');let total=itens.reduce((s,x)=>s+x.valor,0),fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'';let mesNome=mes?new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(mes+'-01T12:00:00')):'';let w=window.open('','_blank');if(!w)return alert('Permita pop-ups para gerar a emissão.');w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>CS Jardinagem — Cobrança</title><style>body{font-family:Arial,sans-serif;color:#172018;margin:0;padding:30px;background:#fff}.doc{max-width:800px;margin:auto;border:1px solid #dce5df;border-radius:16px;padding:30px}.head{border-bottom:3px solid #166534;padding-bottom:16px;margin-bottom:22px}.brand{font-size:28px;font-weight:900;color:#166534}.muted{color:#68736b}.box{background:#f4f7f5;border-radius:12px;padding:14px;margin:14px 0}.box p{margin:5px 0}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px 8px;border-bottom:1px solid #dce5df;text-align:left}th:last-child,td:last-child{text-align:right}.total{font-size:22px;font-weight:900;text-align:right;margin-top:18px;color:#166534}.phrase{margin:20px 0;padding:14px;border-left:4px solid #166534;background:#f4f7f5}.foot{margin-top:28px;font-size:12px;color:#68736b}@media print{body{padding:0}.doc{border:0;padding:10px;max-width:none}} .emissaoItem{border-bottom:1px solid var(--line);padding:12px 0}.emissaoItem:last-child{border-bottom:0}.photoCaptureBtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.cameraModal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:60}.cameraBox{background:#fff;border-radius:18px;padding:16px;width:min(620px,100%)}.cameraVideo{width:100%;max-height:62vh;background:#111;border-radius:14px;object-fit:cover}.cameraActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.pendingPhoto{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px;border:1px solid #dce5df;border-radius:12px;background:#f7faf8}.pendingPhoto img{width:86px;height:70px;object-fit:cover;border-radius:9px}.pendingPhoto span{font-size:13px;color:#68736b}.appVersion{font-size:9px;color:#9aa59e;text-align:center;margin:8px 0 0}.helperPayRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.helperPayInfo{min-width:0}.helperPayCheck{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--g);cursor:pointer;white-space:nowrap}.helperPayCheck input{width:20px;height:20px;accent-color:#16a34a;cursor:pointer}</style></head><body><div class="doc"><div class="head"><div class="brand">🌿 CS Jardinagem</div><div class="muted">Emissão de cobrança</div></div><div class="box"><p><b>Empresa / cliente:</b> ${esc(nome)}</p>${end?`<p><b>Endereço:</b> ${esc(end)}</p>`:''}<p><b>Período:</b> ${esc(mesNome)}</p>${venc?`<p><b>Vencimento:</b> ${fmtDate(venc)}</p>`:''}</div><div class="phrase">${esc(frase).replace(/\n/g,'<br>')}</div><table><thead><tr><th>Data</th><th>Serviço realizado</th><th>Valor</th></tr></thead><tbody>${itens.map(x=>`<tr><td>${fmtDate(x.data)}</td><td>${esc(x.desc)}</td><td>${money(x.valor)}</td></tr>`).join('')}</tbody></table><div class="total">Total: ${money(total)}</div><div class="box"><p><b>Forma de pagamento:</b> ${esc(forma||'Não informada')}</p>${obs?`<p><b>Observações:</b> ${esc(obs)}</p>`:''}</div><div class="foot">Documento de cobrança emitido pelo CS Jardinagem.</div></div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()};
function usersPage(){if(profile?.perfil!=='master')return tab('inicio');dbClient.from('profiles').select('id,nome,ativo,perfil').order('nome').then(r=>{$('content').innerHTML=`<div class="toolbar"><h2>👥 Usuários</h2></div><div class="panel"><table class="table"><tr><th>Nome</th><th>Perfil</th><th>Ativo</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.perfil==='master'?'👑 Master':'Usuário'}</td><td>${x.ativo?'Sim':'Não'}</td></tr>`).join('')}</table></div>`})}
boot();
</script></body></html>
