<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#166534">
<title>CS Jardinagem App</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--g:#166534;--g2:#15803d;--bg:#f4f7f5;--card:#fff;--txt:#172018;--muted:#68736b;--line:#dce5df;--red:#dc2626;--yellow:#d97706;--green:#16a34a;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--txt)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 8px 30px #0000000b;width:min(560px,100%)}
h1,h2,h3{margin-top:0}.logo{font-size:34px;font-weight:800}.logo span{color:var(--g)}
label{display:block;font-weight:700;margin:12px 0 6px}.field{width:100%;padding:13px 14px;border:1px solid #cfdad3;border-radius:12px;background:#fafdff}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:800}.btn.alt{background:#eef5f0;color:var(--g)}.btn.danger{background:#fee2e2;color:#991b1b}
.login .btn{width:100%;margin-top:14px;font-size:17px}.muted{color:var(--muted)}
header{background:linear-gradient(135deg,#166534,#15803d);color:#fff;padding:22px 5vw 20px}
.headerrow{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{margin:0;font-size:28px}.brand small{display:block;margin-top:5px}
nav{background:#fff;border-radius:18px;padding:8px;display:flex;gap:6px;margin:-1px auto 18px;width:min(1100px,92%);box-shadow:0 6px 20px #00000010}
nav button{flex:1;border:0;background:transparent;padding:13px 8px;border-radius:12px;font-weight:800;color:#526159}nav button.active{background:#e8f5ec;color:var(--g)}
main{width:min(1100px,94%);margin:20px auto 50px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:25px;display:block;margin-top:5px}
.calendarHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:125px;padding:9px;overflow:hidden}.day.other{opacity:.45}.day.today{outline:2px solid #86efac}.dow{font-size:11px;color:var(--muted);font-weight:800}.num{font-size:20px;font-weight:900;margin:4px 0 7px}.appt{font-size:12px;padding:5px 6px;margin:4px 0;border-radius:8px;background:#f3f7f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(720px,100%);max-height:90vh;overflow:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.notice{padding:10px 12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:10px 0}
@media(max-width:720px){.stats,.grid2,.grid3{grid-template-columns:1fr}.calendar{gap:4px}.day{min-height:105px;padding:6px}.appt{font-size:10px}.brand h1{font-size:23px}nav button{font-size:12px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="card">
    <div class="logo">🌿 <span>CS Jardinagem</span></div>
    <p class="muted">Entre para acessar sua agenda.</p>
    <label>E-mail</label><input id="email" class="field" type="email" autocomplete="username">
    <label>Senha</label><input id="password" class="field" type="password" autocomplete="current-password">
    <button class="btn" onclick="login()">Entrar</button>
    <p id="loginMsg" class="muted"></p>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div class="headerrow">
    <div class="brand"><h1>🌿 CS Jardinagem App</h1><small id="who"></small></div>
    <button class="btn alt" onclick="logout()">Sair</button>
  </div>
</header>
<nav>
  <button data-tab="inicio" class="active" onclick="tab('inicio')">📅 Agenda</button>
  <button data-tab="clientes" onclick="tab('clientes')">👤 Clientes</button>
  <button data-tab="ajudantes" onclick="tab('ajudantes')">👷 Ajudantes</button>
  <button data-tab="financeiro" onclick="tab('financeiro')">💰 Financeiro</button>
  <button id="usersTab" data-tab="usuarios" onclick="tab('usuarios')">👥 Usuários</button>
</nav>
<main id="content"></main>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalBody"></div></div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const URL='https://lttqucegcmzwfsnrtdyj.supabase.co';
const KEY='sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG';
const db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.db=db;

let me=null, profile=null, clients=[], appts=[], helpers=[], month=new Date(); month.setDate(1);

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>{const x=new Date(d);return x.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const situacaoDot=s=>s==='red'?'red':s==='yellow'?'yellow':'green';
function msg(t){$('loginMsg').textContent=t}

async function boot(){
  const {data,error}=await db.auth.getSession();
  if(error){msg(error.message);return}
  if(data.session){me=data.session.user; await loadProfile(); await loadData(); showApp();} else showLogin();
  db.auth.onAuthStateChange(async (_event,session)=>{
    if(session){me=session.user; await loadProfile(); await loadData(); showApp();}
    else showLogin();
  });
}
async function loadProfile(){
  const r=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();
  if(r.error){console.error(r.error); profile={id:me.id,nome:me.email,perfil:'usuario',ativo:true};}
  else profile=r.data||{id:me.id,nome:me.email,perfil:'usuario',ativo:true};
  $('who').textContent=(profile.nome||me.email)+' · '+(profile.perfil==='master'?'👑 Master':'Usuário');
  $('usersTab').classList.toggle('hidden',profile.perfil!=='master');
}
async function loadData(){
  const c=await db.from('clientes').select('*').order('nome');
  clients=c.data||[];
  const a=await db.from('atendimentos').select('*,clientes(nome),profiles(nome)').order('data_atendimento');
  appts=a.data||[];
  const h=await db.from('ajudantes_diarios').select('*').order('data');
  helpers=h.data||[];
}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');tab('inicio')}
window.login=async function(){
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password)return msg('Informe e-mail e senha.');
  msg('Entrando...');
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error)msg(error.message);else msg('');
}
window.logout=async()=>{await db.auth.signOut()};
window.tab=async function(t){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  if(t==='inicio')agenda();
  if(t==='clientes')clientPage();
  if(t==='ajudantes')helpersPage();
  if(t==='financeiro')financePage();
  if(t==='usuarios')usersPage();
}
function closeModal(){$('modal').classList.add('hidden')}
function openModal(html){$('modalBody').innerHTML=html+'<div class="row" style="margin-top:14px"><button class="btn alt right" onclick="closeModal()">Fechar</button></div>';$('modal').classList.remove('hidden')}
window.closeModal=closeModal;

function agenda(){
  const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=[];
  for(let i=0;i<42;i++)days.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));
  const names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  const today=iso(new Date());
  const monthAp=appts.filter(a=>{const d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m});
  const unpaid=monthAp.filter(a=>!a.pago).reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
  const earned=monthAp.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
  $('content').innerHTML=`
  <div class="stats">
    <div class="stat"><span class="muted">Serviços no mês</span><b>${money(earned)}</b></div>
    <div class="stat"><span class="muted">Em aberto</span><b>${money(unpaid)}</b></div>
    <div class="stat"><span class="muted">Atendimentos</span><b>${monthAp.length}</b></div>
  </div>
  <div class="calendarHead"><button class="btn alt" onclick="changeMonth(-1)">‹</button><h2>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month)}</h2><div class="row"><button class="btn alt" onclick="changeMonth(1)">›</button><button class="btn" onclick="newAppt()">+ Agendar</button></div></div>
  <div class="calendar">${days.map(d=>{
    const ds=iso(d), list=appts.filter(a=>a.data_atendimento===ds);
    return `<div class="day ${d.getMonth()!==m?'other':''} ${ds===today?'today':''}" onclick="dayDetails('${ds}')">
      <div class="dow">${names[d.getDay()]}</div><div class="num">${d.getDate()}</div>
      ${list.map(a=>`<div class="appt"><span class="dot ${situacaoDot(a.situacao)}"></span>${esc(a.clientes?.nome||'Cliente')} ${a.pago?'✓':''}</div>`).join('')}
      ${list.length?'': '<span class="muted" style="font-size:11px">Livre</span>'}
    </div>`}).join('')}</div>
  <div class="panel"><b>🌦️ Previsão</b><span class="muted"> A previsão é consultada pela internet quando disponível.</span><div id="weather" class="grid3" style="margin-top:10px"></div></div>`;
  weather(y,m);
}
window.changeMonth=n=>{month.setMonth(month.getMonth()+n);agenda()};
window.dayDetails=function(ds){
  const list=appts.filter(a=>a.data_atendimento===ds);
  openModal(`<h2>📅 ${new Date(ds+'T12:00:00').toLocaleDateString('pt-BR')}</h2>
  <button class="btn" onclick="closeModal();openAppt(null,'${ds}')">+ Novo atendimento</button>
  ${list.length?list.map(a=>`<div class="panel"><div class="row"><b>${esc(a.clientes?.nome||'Cliente')}</b><span class="dot ${situacaoDot(a.situacao)}"></span><span>${a.pago?'Pago':'Não pago'}</span><span class="right">${money(a.valor_servico??a.valor)}</span></div><p class="muted">${esc(a.nota||'Sem observação')}</p><button class="btn alt" onclick="closeModal();openAppt(${a.id})">Editar</button></div>`).join(''):'<p class="muted">Nenhum atendimento.</p>'}`);
}
async function weather(y,m){
  const el=$('weather'); if(!el)return;
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.6677&longitude=-46.4614&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=16');
    const j=await r.json();
    el.innerHTML=j.daily.time.slice(0,7).map((d,i)=>`<div class="stat"><b>📅 ${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</b><span>${weatherIcon(j.daily.weather_code[i])} ${j.daily.temperature_2m_min[i]}° / ${j.daily.temperature_2m_max[i]}°C</span></div>`).join('');
  }catch(e){el.innerHTML='<span class="muted">Previsão indisponível no momento.</span>'}
}
function weatherIcon(c){if(c===0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}

window.newAppt=()=>openAppt(null,iso(new Date()));
window.openAppt=function(id=null,ds=iso(new Date())){
 const a=id?appts.find(x=>String(x.id)===String(id)):null;
 openModal(`<h2>${a?'Editar':'Novo'} atendimento</h2>
 <label>Cliente</label><select id="ac" class="field">${clients.map(c=>`<option value="${c.id}" ${a&&a.cliente_id==c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
 <label>Data</label><input id="ad" class="field" type="date" value="${a?.data_atendimento||ds}">
 <div class="grid2"><div><label>Valor do serviço</label><input id="av" class="field" type="number" step=".01" value="${a?.valor_servico??a?.valor??0}"></div>
 <div><label>Situação</label><select id="as" class="field"><option value="green" ${a?.situacao==='green'?'selected':''}>🟢 Tudo certo</option><option value="yellow" ${a?.situacao==='yellow'?'selected':''}>🟡 Atenção</option><option value="red" ${a?.situacao==='red'?'selected':''}>🔴 Urgente</option></select></div></div>
 <label>Observação</label><textarea id="an" class="field" rows="3">${esc(a?.nota||'')}</textarea>
 <label><input id="ap" type="checkbox" ${a?.pago?'checked':''}> Serviço pago</label>
 <button class="btn" onclick="saveAppt(${a? a.id:'null'})">Salvar atendimento</button>`);
}
window.saveAppt=async function(id){
 const p={cliente_id:Number($('ac').value),data_atendimento:$('ad').value,valor_servico:Number($('av').value||0),valor:Number($('av').value||0),situacao:$('as').value,nota:$('an').value,pago:$('ap').checked,pago_em:$('ap').checked?new Date().toISOString():null};
 const r=id?await db.from('atendimentos').update(p).eq('id',id):await db.from('atendimentos').insert({...p,responsavel_id:me.id});
 if(r.error)return alert(r.error.message);
 closeModal();await loadData();agenda();
}

function clientPage(){
 $('content').innerHTML=`<div class="toolbar"><h2>👤 Clientes</h2><button class="btn" onclick="openClient()">+ Cliente</button></div>
 <div class="panel">${clients.length?`<table class="table"><thead><tr><th>Nome</th><th>Telefone</th><th>Serviço</th><th></th></tr></thead><tbody>${clients.map(c=>`<tr><td><b>${esc(c.nome)}</b></td><td>${esc(c.telefone||'')}</td><td>${esc(c.servico_principal||'')}</td><td><button class="btn alt" onclick="openClient(${c.id})">Abrir</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">Nenhum cliente cadastrado.</p>'}</div>`;
}
window.openClient=function(id=null){
 const c=id?clients.find(x=>x.id===id):null;
 openModal(`<h2>${c?'Cliente':'Novo cliente'}</h2><label>Nome</label><input id="cn" class="field" value="${esc(c?.nome||'')}"><label>Telefone</label><input id="ct" class="field" value="${esc(c?.telefone||'')}"><label>Endereço</label><input id="ce" class="field" value="${esc(c?.endereco||'')}"><label>Serviço principal</label><input id="cs" class="field" value="${esc(c?.servico_principal||'')}"><label>Valor padrão do serviço</label><input id="cv" class="field" type="number" step=".01" value="${c?.valor_servico||0}"><label>Observações</label><textarea id="co" class="field">${esc(c?.observacoes||'')}</textarea><button class="btn" onclick="saveClient(${c?c.id:'null'})">Salvar cliente</button>`);
}
window.saveClient=async function(id){
 const p={nome:$('cn').value.trim(),telefone:$('ct').value,endereco:$('ce').value,servico_principal:$('cs').value,valor_servico:Number($('cv').value||0),observacoes:$('co').value};
 if(!p.nome)return alert('Informe o nome.');
 const r=id?await db.from('clientes').update(p).eq('id',id):await db.from('clientes').insert(p);
 if(r.error)return alert(r.error.message);
 closeModal();await loadData();clientPage();
}

function helpersPage(){
 const today=new Date(), monday=new Date(today);monday.setDate(today.getDate()-((today.getDay()+6)%7));const friday=new Date(monday);friday.setDate(monday.getDate()+4);
 const week=helpers.filter(h=>h.data>=iso(monday)&&h.data<=iso(friday));
 const totals={};week.forEach(h=>{for(let i=1;i<=5;i++){const n=h['nome'+i],v=Number(h['valor'+i]||0);if(n)totals[n]=(totals[n]||0)+v}});
 $('content').innerHTML=`<div class="toolbar"><h2>👷 Ajudantes</h2><button class="btn" onclick="openHelperDay()">+ Registrar dia</button></div>
 <div class="panel"><h3>💵 Pagamento da semana</h3>${Object.keys(totals).length?`<table class="table"><tr><th>Ajudante</th><th>Total da semana</th></tr>${Object.entries(totals).map(([n,v])=>`<tr><td>${esc(n)}</td><td><b>${money(v)}</b></td></tr>`).join('')}</table>`:'<p class="muted">Nenhum valor registrado nesta semana.</p>'}</div>
 <div class="panel"><h3>Registros da semana</h3>${week.length?week.map(h=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${new Date(h.data+'T12:00:00').toLocaleDateString('pt-BR')}</b><span class="muted">${[1,2,3,4,5].filter(i=>h['nome'+i]).map(i=>esc(h['nome'+i])+' '+money(h['valor'+i])).join(' · ')}</span><button class="btn alt right" onclick="openHelperDay('${h.data}',${h.id})">Editar</button></div>`).join(''):'<p class="muted">Nenhum registro.</p>'}</div>`;
}
window.openHelperDay=function(ds=iso(new Date()),id=null){
 const h=id?helpers.find(x=>x.id===id):helpers.find(x=>x.data===ds);
 openModal(`<h2>👷 Ajudantes — ${new Date(ds+'T12:00:00').toLocaleDateString('pt-BR')}</h2><label>Data</label><input id="hd" class="field" type="date" value="${h?.data||ds}">
 ${[1,2,3,4,5].map(i=>`<div class="grid2"><div><label>Ajudante ${i}</label><input id="hn${i}" class="field" value="${esc(h?.['nome'+i]||'')}"></div><div><label>Valor</label><input id="hv${i}" class="field" type="number" step=".01" value="${h?.['valor'+i]||0}"></div></div>`).join('')}
 <button class="btn" onclick="saveHelper(${h?.id||'null'})">Salvar registro</button>`);
}
window.saveHelper=async function(id){
 const p={data:$('hd').value};for(let i=1;i<=5;i++){p['nome'+i]=$('hn'+i).value.trim()||null;p['valor'+i]=Number($('hv'+i).value||0)}
 const r=id?await db.from('ajudantes_diarios').update(p).eq('id',id):await db.from('ajudantes_diarios').insert(p);
 if(r.error)return alert(r.error.message);
 closeModal();await loadData();helpersPage();
}

function financePage(){
 const y=month.getFullYear(),m=month.getMonth(), arr=appts.filter(a=>{const d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m});
 let earned=0,paid=0;arr.forEach(a=>{earned+=Number(a.valor_servico??a.valor??0);if(a.pago)paid+=Number(a.valor_servico??a.valor??0)});
 let helperTotal=0;helpers.forEach(h=>{const d=new Date(h.data+'T12:00:00');if(d.getFullYear()===y&&d.getMonth()===m)for(let i=1;i<=5;i++)helperTotal+=Number(h['valor'+i]||0)});
 $('content').innerHTML=`<div class="toolbar"><h2>💰 Financeiro</h2></div><div class="stats"><div class="stat">Serviços faturados<b>${money(earned)}</b></div><div class="stat">Serviços recebidos<b>${money(paid)}</b></div><div class="stat">Ajudantes pagos<b>${money(helperTotal)}</b></div></div><div class="panel"><p><b>Líquido após ajudantes:</b> ${money(earned-helperTotal)}</p><p class="muted">Os valores são calculados a partir dos atendimentos e registros de ajudantes.</p></div>`;
}
function usersPage(){
 if(profile?.perfil!=='master')return tab('inicio');
 db.from('profiles').select('id,nome,ativo,perfil').order('nome').then(r=>{
   const rows=r.data||[];
   $('content').innerHTML=`<div class="toolbar"><h2>👥 Usuários</h2></div><div class="notice">👑 Carlos e Cláudia são Masters. Usuários comuns não têm acesso ao gerenciamento desta tela.</div><div class="panel"><table class="table"><tr><th>Nome</th><th>Perfil</th><th>Ativo</th></tr>${rows.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.perfil==='master'?'👑 Master':'Usuário'}</td><td>${x.ativo?'Sim':'Não'}</td></tr>`).join('')}</table></div>`;
 });
}
boot();
</script>
</body>
</html>
