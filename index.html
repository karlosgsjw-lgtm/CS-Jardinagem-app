<style>
:root{--g:#166534;--g2:#15803d;--bg:#f4f7f5;--card:#fff;--txt:#172018;--muted:#68736b;--line:#dce5df;--red:#dc2626;--yellow:#d97706;--green:#16a34a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}header{background:linear-gradient(135deg,#14532d,#15803d);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:19px;margin:0}.brand small{opacity:.8}nav{display:flex;gap:7px;overflow:auto;padding-top:12px}nav button{background:#ffffff18;color:#fff;padding:9px 11px;border-radius:10px;white-space:nowrap}nav button.active{background:#fff;color:var(--g);font-weight:700}main{max-width:1200px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 2px 8px #17321a0a}.card h3{margin:0 0 10px}.metric{font-size:26px;font-weight:800}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.btn{background:var(--g);color:#fff;padding:10px 13px;border-radius:10px;font-weight:650}.btn.alt{background:#e8f1eb;color:var(--g)}.btn.danger{background:#fee2e2;color:#991b1b}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}label{font-size:12px;color:var(--muted);font-weight:650;display:block;margin:8px 0 4px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal>div{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:6px}.day{min-height:95px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px;overflow:hidden}.day.other{opacity:.45}.day.today{outline:2px solid var(--g2)}.daynum{font-weight:800;font-size:12px}.appt{font-size:10px;background:#f3f6f4;border-radius:6px;padding:3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photoGrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf5ef;color:var(--g);font-size:11px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.day{min-height:76px}.appt{font-size:9px}.photoGrid{grid-template-columns:repeat(2,1fr)}main{padding:10px}}
</style></head>
<body>
<div id="login" class="login"><div class="card"><h2>🌿 CS Jardinagem</h2><p class="muted">Entre para acessar sua agenda.</p><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="hidden"><header><div class="brand"><div><h1>🌿 CS Jardinagem App</h1><small id="who"></small></div><button class="btn alt" onclick="logout()">Sair</button></div><nav><button data-tab="inicio" onclick="tab('inicio')">Início</button><button data-tab="agenda" onclick="tab('agenda')">Agenda</button><button data-tab="clientes" onclick="tab('clientes')">Clientes</button><button data-tab="financeiro" onclick="tab('financeiro')">Financeiro</button><button data-tab="ajudantes" onclick="tab('ajudantes')">Ajudantes</button><button data-tab="usuarios" id="usersTab" class="hidden" onclick="tab('usuarios')">Usuários</button></nav></header><main id="content"></main></div>
<div id="modal" class="modal hidden"><div id="modalBody"></div></div>
<script>
var URL='https://lttqucegcmzwfsnrtdyj.supabase.co';var KEY='sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG';var db=supabase.createClient(URL,KEY);let me=null,profile=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=d=>{let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)};const closeModal=()=>modal.classList.add('hidden');function openModal(x){modalBody.innerHTML=x;modal.classList.remove('hidden')}modal.onclick=e=>e.target===modal&&closeModal();
async function boot(){let {data:{session}}=await db.auth.getSession();if(session){me=session.user;await loadProfile();showApp()}else showLogin();db.auth.onAuthStateChange(async(_,s)=>{if(s){me=s.user;await loadProfile();showApp()}})}function showLogin(){login.classList.remove('hidden');app.classList.add('hidden')}function showApp(){login.classList.add('hidden');app.classList.remove('hidden');who.textContent=(profile?.nome||me.email)+' • '+(profile?.perfil==='master'?'MASTER':'usuário');usersTab.classList.toggle('hidden',profile?.perfil!=='master');tab(tabName)}async function login(){loginMsg.textContent='Entrando...';try{let req=db.auth.signInWithPassword({email:email.value.trim(),password:password.value});let r=await Promise.race([req,new Promise((_,rej)=>setTimeout(()=>rej(new Error('A conexão com o Supabase demorou demais. Verifique a internet e tente novamente.')),15000))]);if(r.error){loginMsg.textContent=r.error.message;return}if(r.data?.session){me=r.data.session.user;await loadProfile();showApp()}}catch(e){loginMsg.textContent=e?.message||'Não foi possível entrar. Tente novamente.'}}async function logout(){await db.auth.signOut();location.reload()}async function loadProfile(){try{let r=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();if(r.error)throw r.error;profile=r.data||{nome:me.email,perfil:'usuario',ativo:true}}catch(e){profile={nome:me?.email||'Usuário',perfil:'usuario',ativo:true};console.warn('Perfil:',e)}}
async function loadData(){let a=await db.from('clientes').select('*').order('nome');clients=a.data||[];let b=await db.from('atendimentos').select('*,clientes(nome),profiles(nome)').order('data_atendimento');appts=b.data||[];let h=await db.from('ajudantes_diarios').select('*').order('data');helpers=h.data||[];let rh=await db.from('ajudantes').select('*').order('nome');registeredHelpers=rh.data||[]}
async function tab(t){tabName=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));await loadData();if(t==='inicio')home();if(t==='agenda')agenda();if(t==='clientes')clientPage();if(t==='financeiro')finance();if(t==='ajudantes')helpersPage();if(t==='usuarios')users()}
function home(){let today=appts.filter(a=>a.data_atendimento===iso(new Date())),earned=appts.reduce((s,a)=>s+Number(a.valor_servico||a.valor||0),0),unpaid=appts.filter(a=>!a.pago).reduce((s,a)=>s+Number(a.valor_servico||a.valor||0),0);content.innerHTML=`<h2>Olá, ${esc(profile.nome||'')} 👋</h2><div class="grid"><div class="card"><h3>Hoje</h3><div class="metric">${today.length}</div><div class="muted">atendimentos</div></div><div class="card"><h3>Serviços</h3><div class="metric">${money(earned)}</div><div class="muted">cadastrados</div></div><div class="card"><h3>A receber</h3><div class="metric">${money(unpaid)}</div><div class="muted">não pagos</div></div></div><div class="card" style="margin-top:12px"><h3>Atendimentos de hoje</h3>${today.map(a=>`<p><span class="dot ${a.situacao==='red'?'red':a.situacao==='yellow'?'yellow':'green'}"></span><b>${esc(a.clientes?.nome)}</b> — ${money(a.valor_servico||a.valor)} ${a.pago?'✓ pago':'• pendente'}</p>`).join('')||'<p class="muted">Nenhum atendimento hoje.</p>'}</div>`}
function agenda(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=[];for(let i=0;i<42;i++)days.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));content.innerHTML=`<div class="toolbar"><button class="btn alt" onclick="moveMonth(-1)">‹</button><h2 style="margin:0">${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn alt" onclick="moveMonth(1)">›</button><button class="btn" onclick="openAppt()">+ Atendimento</button></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="dow">${x}</div>`).join('')}${days.map(d=>{let ds=iso(d),list=appts.filter(a=>a.data_atendimento===ds);return `<div class="day ${d.getMonth()!=m?'other':''} ${ds===iso(new Date())?'today':''}" onclick="openAppt(null,'${ds}')"><div class="daynum">${d.getDate()} ${weather[ds]?.icon||''}</div>${list.slice(0,6).map(a=>`<div class="appt" onclick="event.stopPropagation();openAppt('${a.id}')"><span class="dot ${a.situacao==='red'?'red':a.situacao==='yellow'?'yellow':'green'}"></span>${esc(a.clientes?.nome)}${a.pago?' ✓':''}</div>`).join('')}</div>`}).join('')}</div>`}function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);tab('agenda')}
function openAppt(id=null,ds=iso(new Date())){let a=id?appts.find(x=>String(x.id)===String(id)):null;openModal(`<h3>${a?'Editar':'Novo'} atendimento</h3><div class="formgrid"><div class="full"><label>Cliente</label><select id="aClient">${clients.map(c=>`<option value="${c.id}" ${a&&a.cliente_id==c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div><div><label>Data</label><input id="aDate" type="date" value="${a?.data_atendimento||ds}"></div><div><label>Valor do serviço</label><input id="aValue" type="number" step=".01" value="${a?.valor_servico||a?.valor||0}"></div><div><label>Situação</label><select id="aStatus"><option value="green" ${a?.situacao==='green'?'selected':''}>🟢 Tudo certo</option><option value="yellow" ${a?.situacao==='yellow'?'selected':''}>🟡 Atenção</option><option value="red" ${a?.situacao==='red'?'selected':''}>🔴 Urgente</option></select></div><div><label>Pagamento</label><label><input id="aPaid" type="checkbox" style="width:auto" ${a?.pago?'checked':''}> Pago</label></div><div class="full"><label>Observação</label><textarea id="aNote" rows="3">${esc(a?.nota||'')}</textarea></div></div><h4>Ajudantes do dia (até 5)</h4><div id="helperFields">Carregando...</div><div class="toolbar"><button class="btn" onclick="saveAppt(${a?`'${a.id}'`:'null'})">Salvar</button><button class="btn alt" onclick="closeModal()">Cancelar</button>${a?`<button class="btn danger" onclick="deleteAppt('${a.id}')">Excluir</button>`:''}</div>`);loadHelpers(a?.data_atendimento||ds)}async function loadHelpers(ds){let r=await db.from('ajudantes_diarios').select('*').eq('data',ds).maybeSingle(),h=r.data||{};helperFields.innerHTML=Array.from({length:5},(_,i)=>{let id=h['ajudante_id'+(i+1)]||'',nm=h['nome'+(i+1)]||'',val=h['valor'+(i+1)]||0;return `<div class="formgrid"><div><label>Ajudante ${i+1}</label><select id="hid${i+1}" onchange="helperChanged(${i+1})"><option value="">— nenhum —</option>${registeredHelpers.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}" data-name="${esc(x.nome)}" data-value="${x.valor_padrao||0}" ${String(x.id)===String(id)?'selected':''}>${esc(x.nome)}</option>`).join('')}${nm&&!registeredHelpers.some(x=>String(x.id)===String(id))?`<option value="custom_${i+1}" selected>${esc(nm)} (avulso)</option>`:''}</select></div><div><label>Valor do dia</label><input id="hv${i+1}" type="number" step=".01" value="${val||0}"></div></div>`}).join('')}
function helperChanged(i){let s=document.getElementById('hid'+i),o=s.options[s.selectedIndex];if(o&&o.dataset.value&&(!document.getElementById('hv'+i).value||Number(document.getElementById('hv'+i).value)===0))document.getElementById('hv'+i).value=o.dataset.value;}
async function saveAppt(id){let p={cliente_id:Number(aClient.value),data_atendimento:aDate.value,valor_servico:Number(aValue.value||0),valor:Number(aValue.value||0),situacao:aStatus.value,nota:aNote.value,pago:aPaid.checked,responsavel_id:me.id,atualizado_em:new Date().toISOString()},r=id?await db.from('atendimentos').update(p).eq('id',id):await db.from('atendimentos').insert(p);if(r.error)return alert(r.error.message);let h={data:aDate.value};for(let i=1;i<=5;i++){let sel=document.getElementById('hid'+i),o=sel.options[sel.selectedIndex],id=sel.value||null;h['ajudante_id'+i]=(id&&/^\d+$/.test(id))?Number(id):null;h['nome'+i]=o&&o.dataset.name?o.dataset.name:(o?.textContent||'').replace(/ \(avulso\)$/,'')||null;h['valor'+i]=Number(document.getElementById('hv'+i).value||0)}let hr=await db.from('ajudantes_diarios').upsert(h,{onConflict:'data'});if(hr.error)alert('Atendimento salvo, mas ajudantes: '+hr.error.message);closeModal();tab('agenda')}async function deleteAppt(id){if(confirm('Excluir este atendimento?')){let r=await db.from('atendimentos').delete().eq('id',id);if(r.error)alert(r.error.message);else{closeModal();tab('agenda')}}}
function clientPage(){content.innerHTML=`<div class="toolbar"><h2 style="margin:0">Clientes</h2><button class="btn" onclick="openClient()">+ Cliente</button><input id="q" placeholder="Pesquisar..." style="max-width:260px" oninput="filterClients()"></div><div class="card"><div id="clientList"></div></div>`;filterClients()}function filterClients(){let q=(document.getElementById('q')?.value||'').toLowerCase(),arr=clients.filter(c=>(c.nome||'').toLowerCase().includes(q));clientList.innerHTML=arr.map(c=>`<div class="card" style="margin:8px 0;cursor:pointer" onclick="openClient('${c.id}')"><b>${esc(c.nome)}</b><div class="muted">${esc(c.telefone||'')} • ${esc(c.servico_principal||'')}</div></div>`).join('')||'<p class="muted">Nenhum cliente.</p>'}function openClient(id=null){let c=id?clients.find(x=>String(x.id)===String(id)):null;openModal(`<h3>${c?'Editar':'Novo'} cliente</h3><div class="formgrid"><div class="full"><label>Nome</label><input id="cNome" value="${esc(c?.nome||'')}"></div><div><label>Telefone</label><input id="cTel" autocomplete="off" value="${esc(c?.telefone||'')}"></div><div><label>Valor padrão</label><input id="cVal" type="number" step=".01" value="${c?.valor_servico||0}"></div><div class="full"><label>Endereço</label><input id="cEnd" autocomplete="off" value="${esc(c?.endereco||'')}"></div><div class="full"><label>Serviço principal</label><input id="cSvc" value="${esc(c?.servico_principal||'')}"></div><div class="full"><label>Observações</label><textarea id="cObs">${esc(c?.observacoes||'')}</textarea></div></div><div class="toolbar"><button class="btn" onclick="saveClient(${c?`'${c.id}'`:'null'})">Salvar</button><button class="btn alt" onclick="closeModal()">Cancelar</button>${c?`<button class="btn alt" onclick="photos('${c.id}')">📷 Fotos</button>`:''}</div>`)}async function saveClient(id){let p={nome:cNome.value.trim(),telefone:cTel.value.trim(),endereco:cEnd.value.trim(),servico_principal:cSvc.value.trim(),observacoes:cObs.value,valor_servico:Number(cVal.value||0)};if(!p.nome)return alert('Informe o nome.');let r=id?await db.from('clientes').update(p).eq('id',id):await db.from('clientes').insert(p);if(r.error)alert(r.error.message);else{closeModal();tab('clientes')}}
async function photos(cid){let c=clients.find(x=>String(x.id)===String(cid)),r=await db.from('cliente_fotos').select('*').eq('cliente_id',cid).order('criado_em',{ascending:false}),ps=r.data||[];openModal(`<h3>📷 ${esc(c?.nome)}</h3><div class="toolbar"><label class="btn" style="color:#fff">Adicionar foto<input id="photo" type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto('${cid}')"></label></div><div class="photoGrid">${ps.map(p=>`<div><img src="${esc(p.imagem_data)}" onclick="viewPhoto('${p.id}')"><div class="muted">${esc(p.descricao||'Sem descrição')}</div></div>`).join('')||'<p class="muted">Nenhuma foto.</p>'}</div><button class="btn alt" onclick="closeModal()">Fechar</button>`)}async function addPhoto(cid){let f=photo.files[0];if(!f)return;let rd=new FileReader();rd.onload=async()=>{let d=prompt('Descrição da foto (opcional):',''),r=await db.from('cliente_fotos').insert({cliente_id:Number(cid),imagem_data:rd.result,descricao:d||null});if(r.error)alert(r.error.message);else photos(cid)};rd.readAsDataURL(f)}async function viewPhoto(id){let r=await db.from('cliente_fotos').select('*').eq('id',id).single();if(r.data)openModal(`<img src="${esc(r.data.imagem_data)}" style="width:100%;max-height:70vh;object-fit:contain"><p><b>${esc(r.data.descricao||'Sem descrição')}</b></p><button class="btn alt" onclick="closeModal()">Fechar</button>`)}
function helpersPage(){content.innerHTML=`<div class="toolbar"><h2 style="margin:0">👷 Ajudantes</h2><button class="btn" onclick="openHelper()">+ Cadastrar ajudante</button></div><div class="card"><table><tr><th>Nome</th><th>Telefone</th><th>Valor padrão</th><th>Status</th><th></th></tr>${registeredHelpers.map(h=>`<tr><td><b>${esc(h.nome)}</b></td><td>${esc(h.telefone||'')}</td><td>${money(h.valor_padrao||0)}</td><td>${h.ativo?'Ativo':'Inativo'}</td><td><button class="btn alt" onclick="openHelper('${h.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan=5 class="muted">Nenhum ajudante cadastrado.</td></tr>'}</table></div><div class="card" style="margin-top:12px"><h3>💰 Pagamento semanal</h3><p class="muted">Os valores lançados em cada atendimento são somados por ajudante de segunda a sexta.</p>${weeklyHelperRows(new Date())}</div>`}function openHelper(id=null){let h=id?registeredHelpers.find(x=>String(x.id)===String(id)):null;openModal(`<h3>${h?'Editar':'Cadastrar'} ajudante</h3><div class="formgrid"><div class="full"><label>Nome</label><input id="hNome" value="${esc(h?.nome||'')}"></div><div><label>Telefone</label><input id="hTel" autocomplete="off" value="${esc(h?.telefone||'')}"></div><div><label>Valor padrão por dia</label><input id="hVal" type="number" step=".01" value="${h?.valor_padrao||0}"></div><div><label>Status</label><select id="hAtivo"><option value="true" ${h?.ativo!==false?'selected':''}>Ativo</option><option value="false" ${h?.ativo===false?'selected':''}>Inativo</option></select></div></div><div class="toolbar"><button class="btn" onclick="saveHelper(${h?`'${h.id}'`:'null'})">Salvar</button><button class="btn alt" onclick="closeModal()">Cancelar</button></div>`)}async function saveHelper(id){let p={nome:hNome.value.trim(),telefone:hTel.value.trim(),valor_padrao:Number(hVal.value||0),ativo:hAtivo.value==='true'};if(!p.nome)return alert('Informe o nome.');let r=id?await db.from('ajudantes').update(p).eq('id',id):await db.from('ajudantes').insert(p);if(r.error)alert(r.error.message);else{closeModal();tab('ajudantes')}}function weekRange(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay()||7;let mon=new Date(x);mon.setDate(x.getDate()-day+1);let fri=new Date(mon);fri.setDate(mon.getDate()+4);return [iso(mon),iso(fri)]}function weeklyHelperTotals(d){let [mon,fri]=weekRange(d),rows=registeredHelpers.map(h=>({h,total:helpers.filter(x=>x.data>=mon&&x.data<=fri).reduce((s,x)=>{let t=0;for(let i=1;i<=5;i++)if(String(x['ajudante_id'+i])===String(h.id))t+=Number(x['valor'+i]||0);return s+t},0)}));return rows}function weeklyHelperRows(d){let rows=weeklyHelperTotals(d);return `<table><tr><th>Ajudante</th><th>Seg–Sex</th></tr>${rows.map(r=>`<tr><td>${esc(r.h.nome)}</td><td><b>${money(r.total)}</b></td></tr>`).join('')||'<tr><td colspan=2 class="muted">Nenhum ajudante cadastrado.</td></tr>'}</table>`}
function finance(){let m=month.getMonth(),y=month.getFullYear(),arr=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y}),earned=arr.reduce((s,a)=>s+Number(a.valor_servico||a.valor||0),0),received=arr.filter(a=>a.pago).reduce((s,a)=>s+Number(a.valor_servico||a.valor||0),0),helper=helpers.filter(h=>{let d=new Date(h.data+'T12:00:00');return d.getMonth()===m&&d.getFullYear()===y}).reduce((s,h)=>s+[1,2,3,4,5].reduce((x,i)=>x+Number(h['valor'+i]||0),0),0);let today=new Date(),isFriday=today.getDay()===5;content.innerHTML=`<div class="toolbar"><button class="btn alt" onclick="moveMonth(-1);tab('financeiro')">‹</button><h2 style="margin:0">${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn alt" onclick="moveMonth(1);tab('financeiro')">›</button></div><div class="grid"><div class="card"><h3>Serviços</h3><div class="metric">${money(earned)}</div></div><div class="card"><h3>Recebido</h3><div class="metric">${money(received)}</div></div><div class="card"><h3>Ajudantes no mês</h3><div class="metric">${money(helper)}</div><div class="muted">Saldo: ${money(earned-helper)}</div></div></div><div class="card" style="margin-top:12px"><h3>${isFriday?'💵 Pagamento dos ajudantes — esta semana':'💵 Ajudantes — semana atual'}</h3><p class="muted">Total individual de segunda a sexta.</p>${weeklyHelperRows(today)}</div><div class="card" style="margin-top:12px"><h3>Serviços do mês</h3><table><tr><th>Data</th><th>Cliente</th><th>Valor</th><th>Pagamento</th></tr>${arr.map(a=>`<tr><td>${a.data_atendimento}</td><td>${esc(a.clientes?.nome)}</td><td>${money(a.valor_servico||a.valor)}</td><td>${a.pago?'✓ Pago':'Pendente'}</td></tr>`).join('')}</table></div>`}
function users(){if(profile.perfil!=='master')return tab('inicio');db.from('profiles').select('id,nome,ativo,perfil').order('nome').then(r=>{let rows=r.data||[];content.innerHTML=`<div class="toolbar"><h2 style="margin:0">👑 Usuários</h2><span class="pill">Área Master</span></div><div class="card"><p class="muted">Masters podem ativar/desativar perfis existentes. A criação de contas de autenticação deve usar um fluxo administrativo seguro no servidor; não colocamos a chave secreta do Supabase no navegador.</p><table><tr><th>Nome</th><th>Perfil</th><th>Status</th><th>Ação</th></tr>${rows.map(u=>`<tr><td>${esc(u.nome)}</td><td>${u.perfil==='master'?'👑 Master':'Usuário'}</td><td>${u.ativo?'Ativo':'Inativo'}</td><td>${u.id===me.id?'—':`<button class="btn alt" onclick="toggleUser('${u.id}',${!u.ativo})">${u.ativo?'Desativar':'Ativar'}</button>`}</td></tr>`).join('')}</table></div>`})}async function toggleUser(id,v){let r=await db.from('profiles').update({ativo:v}).eq('id',id);if(r.error)alert(r.error.message);else tab('usuarios')}
boot();
</script></body></html>
