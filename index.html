<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166534"><title>CS Jardinagem App</title>
<style>
:root{--g:#166534;--g2:#15803d;--bg:#f4f7f5;--card:#fff;--txt:#172018;--muted:#68736b;--line:#dce5df;--red:#dc2626;--yellow:#d97706;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--txt)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 8px 30px #0001;width:min(560px,100%)}h1,h2,h3{margin-top:0}.logo{font-size:32px;font-weight:800}.logo span{color:var(--g)}label{display:block;font-weight:700;margin:11px 0 5px}.field{width:100%;padding:12px;border:1px solid #cfdad3;border-radius:11px;background:#fafdff}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--g);color:#fff;font-weight:800}.btn.alt{background:#eaf3ed;color:var(--g)}.btn.danger{background:#fee2e2;color:#991b1b}.login .btn{width:100%;margin-top:14px;font-size:17px}.muted{color:var(--muted)}header{background:linear-gradient(135deg,#166534,#15803d);color:#fff;padding:20px 5vw}.headerrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:27px}.brand small{display:block;margin-top:4px}nav{background:#fff;border-radius:17px;padding:7px;display:flex;gap:5px;margin:0 auto 18px;width:min(1120px,94%);box-shadow:0 5px 18px #0001}nav button{flex:1;border:0;background:transparent;padding:12px 7px;border-radius:11px;font-weight:800;color:#536058}nav button.active{background:#e7f4eb;color:var(--g)}main{width:min(1120px,94%);margin:20px auto 50px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.stat b{display:block;font-size:24px;margin-top:4px}.footerLinks{display:flex;justify-content:center;gap:18px;margin:24px 0 6px}.footerLinks a{font-size:12px;text-decoration:none;color:var(--g);font-weight:800}.annualGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.annualMonth{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}.annualMonth h4{margin:0 0 6px;text-transform:capitalize}.miniCal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px}.miniCal span{padding:4px 0;text-align:center}.markDate{background:#fecaca;color:#991b1b;border-radius:50%;font-weight:900}.calendarHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:#fff;border:1px solid var(--line);border-radius:11px;min-height:125px;padding:8px;overflow:hidden}.day.other{opacity:.42}.day.today{outline:2px solid #86efac}.dow{font-size:10px;color:var(--muted);font-weight:800}.num{font-size:20px;font-weight:900;margin:3px 0}.weatherIcon{font-size:12px;margin-left:4px}.appt{font-size:11px;padding:5px;margin:3px 0;border-radius:7px;background:#f1f6f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:13px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:20}.modalbox{background:#fff;border-radius:18px;padding:19px;width:min(760px,100%);max-height:92vh;overflow:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.photoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photo{border:1px solid var(--line);border-radius:10px;padding:6px}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}.small{font-size:12px}.notice{padding:10px;border-radius:10px;background:#fff7ed;color:#9a3412}.helperRow{display:grid;grid-template-columns:1.3fr .7fr auto;gap:8px;align-items:end;margin:8px 0}.clientActions{display:flex;gap:6px;justify-content:flex-end}.infoLine{padding:7px 0;border-bottom:1px solid var(--line)}
@media(max-width:720px){.stats,.grid2,.grid3{grid-template-columns:1fr}.calendar{gap:3px}.day{min-height:105px;padding:5px}.appt{font-size:9px}.brand h1{font-size:22px}nav button{font-size:11px}.helperRow{grid-template-columns:1fr 1fr}.helperRow .remove{grid-column:1/-1}}
@media(max-width:760px){.annualGrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.day{min-height:105px}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="logo">🌿 <span>CS Jardinagem</span></div><p class="muted">Entre para acessar sua agenda.</p><label>E-mail</label><input id="email" class="field" type="email" autocomplete="username"><label>Senha</label><input id="password" class="field" type="password" autocomplete="current-password"><button class="btn" onclick="login()">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
<div id="app" class="hidden"><header><div class="headerrow"><div class="brand"><h1>🌿 CS Jardinagem App</h1><small id="who"></small></div><button class="btn alt" onclick="logout()">Sair</button></div></header>
<nav><button data-tab="inicio" class="active" onclick="tab('inicio')">📅 Agenda</button><button data-tab="anual" onclick="tab('anual')">🗓️ Agenda Anual</button><button data-tab="clientes" onclick="tab('clientes')">👤 Clientes</button><button data-tab="ajudantes" onclick="tab('ajudantes')">👷 Ajudantes</button><button data-tab="financeiro" onclick="tab('financeiro')">💰 Financeiro</button><button id="usersTab" data-tab="usuarios" onclick="tab('usuarios')">👥 Usuários</button></nav><main id="content"></main><div class="footerLinks"><a href="https://csjardimepiscina.wixsite.com/website" target="_blank">🌐 Site</a><a href="https://www.instagram.com/csjardinagemepiscina?stkn=MWdpMzBuamhweGYycg%3D%3D" target="_blank">📷 Instagram</a></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalBody"></div></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const URL='https://lttqucegcmzwfsnrtdyj.supabase.co',KEY='sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG',db=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let me=null,profile=null,clients=[],appts=[],helperList=[],annuals=[],photos=[],month=new Date();month.setDate(1);
const $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), iso=d=>{let x=new Date(d);return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10)}, dot=s=>s==='red'?'red':s==='yellow'?'yellow':'green';
function loginMsg(t){$('loginMsg').textContent=t}
async function boot(){let r=await db.auth.getSession();if(r.error)return loginMsg(r.error.message);if(r.data.session){me=r.data.session.user;await start()}else showLogin();db.auth.onAuthStateChange(async(_e,s)=>{if(s){me=s.user;await start()}else showLogin()})}
async function start(){await loadProfile();await loadData();showApp()}
async function loadProfile(){let r=await db.from('profiles').select('*').eq('id',me.id).maybeSingle();profile=r.data||{id:me.id,nome:me.email,perfil:'usuario',ativo:true};$('who').textContent=(profile.nome||me.email)+' · '+(profile.perfil==='master'?'👑 Master':'Usuário');$('usersTab').classList.toggle('hidden',profile.perfil!=='master')}
async function loadData(){let c=await db.from('clientes').select('*').order('nome');clients=c.data||[];let a=await db.from('atendimentos').select('*,clientes(nome,telefone,endereco,servico_principal,observacoes,valor_servico),profiles(nome)').order('data_atendimento');appts=a.data||[];let h=await db.from('ajudantes').select('*').eq('ativo',true).order('nome');helperList=h.data||[];let an=await db.from('agendas_anuais').select('*').order('data_agendada');annuals=an.data||[]}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');tab('inicio')}
window.login=async()=>{loginMsg('Entrando...');let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)loginMsg(r.error.message)};window.logout=()=>db.auth.signOut();window.closeModal=()=>{$('modal').classList.add('hidden')};function openModal(h){$('modalBody').innerHTML=h+'<div class="row" style="margin-top:14px"><button class="btn alt right" onclick="closeModal()">Fechar</button></div>';$('modal').classList.remove('hidden')}
window.tab=t=>{document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='inicio')agenda();if(t==='anual')annualPage();if(t==='clientes')clientPage();if(t==='ajudantes')helpersPage();if(t==='financeiro')financePage();if(t==='usuarios')usersPage()};
function plannedForDate(ds){return annuals.filter(x=>x.data_agendada===ds)}
function agenda(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=[];for(let i=0;i<42;i++)days.push(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));let names=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],today=iso(new Date()),ma=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}),earned=ma.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0),open=ma.filter(a=>!a.pago).reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0);
$('content').innerHTML=`<div class="toolbar"><h2 style="margin:0">Agenda</h2><button class="btn" onclick="newAppt()">+ Agendar</button></div><div class="stats"><div class="stat"><span class="muted">Atendimentos</span><b>${ma.length}</b></div><div class="stat"><span class="muted">Serviço mês</span><b>${money(earned)}</b></div><div class="stat"><span class="muted">Em aberto</span><b>${money(open)}</b></div></div><div class="calendarHead"><button class="btn alt" onclick="changeMonth(-1)">‹</button><h2>${new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(month)}</h2><button class="btn alt" onclick="changeMonth(1)">›</button></div><div class="calendar">${days.map(d=>{let ds=iso(d),list=appts.filter(a=>a.data_atendimento===ds),pl=plannedForDate(ds).filter(x=>!list.some(a=>a.cliente_id===x.cliente_id));return `<div class="day ${d.getMonth()!==m?'other':''} ${ds===today?'today':''}" onclick="dayDetails('${ds}')"><div class="dow">${names[d.getDay()]} <span id="wx-${ds}" class="weatherIcon"></span></div><div class="num">${d.getDate()}</div>${list.map(a=>`<div class="appt"><span class="dot ${dot(a.situacao)}"></span>${esc(a.clientes?.nome||'Cliente')}${a.pago?' ✓':''}</div>`).join('')}${pl.map(x=>`<div class="appt" style="border:1px dashed #ef4444"><span class="dot red"></span>${esc(x.clientes?.nome||clients.find(c=>c.id===x.cliente_id)?.nome||'Cliente')} <span class="small">anual</span></div>`).join('')}${list.length+pl.length?'':'<span class="muted small">Livre</span>'}</div>`}).join('')}</div>`;weather()}
window.changeMonth=n=>{month.setMonth(month.getMonth()+n);agenda()};
let forecast={};async function weather(){forecast={};try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-23.6677&longitude=-46.4614&daily=weather_code&timezone=America%2FSao_Paulo&forecast_days=16');let j=await r.json();j.daily.time.forEach((d,i)=>forecast[d]=weatherIcon(j.daily.weather_code[i]));document.querySelectorAll('[id^="wx-"]').forEach(e=>e.textContent=forecast[e.id.slice(3)]||'')}catch(e){}}
function weatherIcon(c){if(c===0)return'☀️';if(c<=3)return'🌤️';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}
window.dayDetails=ds=>{let list=appts.filter(a=>a.data_atendimento===ds),pl=plannedForDate(ds).filter(x=>!list.some(a=>a.cliente_id===x.cliente_id));openModal(`<h2>📅 ${new Date(ds+'T12:00:00').toLocaleDateString('pt-BR')}</h2><button class="btn" onclick="closeModal();openAppt(null,'${ds}')">+ Incluir cliente neste dia</button>${list.map(a=>`<div class="panel"><div class="row"><b>${esc(a.clientes?.nome||'Cliente')}</b><span class="dot ${dot(a.situacao)}"></span><span>${a.pago?'Pago':'Não pago'}</span><span class="right">${money(a.valor_servico??a.valor)}</span></div><p class="muted">${esc(a.nota||'Sem observação')}</p><button class="btn alt" onclick="closeModal();openAppt(${a.id})">Editar atendimento</button></div>`).join('')}${pl.map(x=>{let c=clients.find(c=>c.id===x.cliente_id);return `<div class="panel"><div class="row"><b>🗓️ ${esc(c?.nome||'Cliente')}</b><span class="right">Planejado na Agenda Anual</span></div><button class="btn" onclick="closeModal();openAppt(null,'${ds}',${x.cliente_id})">Abrir atendimento</button></div>`}).join('')}${!list.length&&!pl.length?'<p class="muted">Nenhum atendimento.</p>':''}`)};
window.newAppt=()=>openAppt(null,iso(new Date()));
async function getPhotos(cid){let r=await db.from('cliente_fotos').select('*').eq('cliente_id',cid).order('criado_em',{ascending:false});return r.data||[]}
function helperFields(a){let out='';for(let i=1;i<=5;i++){let hid=a?.['ajudante_'+i+'_id']||'',val=a?.['ajudante_'+i+'_valor']||0;out+=`<div class="helperRow helperItem"><div><label>Ajudante</label><select id="hid${i}" class="field"><option value="">Nenhum</option>${helperList.map(h=>`<option value="${h.id}" ${String(h.id)===String(hid)?'selected':''}>${esc(h.nome)}</option>`).join('')}</select></div><div><label>Valor do dia</label><input id="hval${i}" class="field" type="number" step=".01" value="${val}"></div><button class="btn danger remove" onclick="removeHelperRow(this)">− Remover</button></div>`}return out}
window.removeHelperRow=el=>{let r=el.closest('.helperItem');r.querySelector('select').value='';r.querySelector('input').value=0};
window.openAppt=async function(id=null,ds=iso(new Date()),plannedClientId=null){let a=id?appts.find(x=>String(x.id)===String(id)):null;if(!clients.length)return alert('Cadastre o cliente primeiro.');let cid=a?.cliente_id||plannedClientId||clients[0].id, p=await getPhotos(cid),c=clients.find(x=>x.id==cid);openModal(`<h2>${a?'Editar':'Novo'} atendimento</h2><label>Cliente</label><select id="ac" class="field" onchange="refreshApptClient()">${clients.map(x=>`<option value="${x.id}" ${x.id==cid?'selected':''}>${esc(x.nome)}</option>`).join('')}</select><div id="clientPreview"></div><label>Data</label><input id="ad" class="field" type="date" value="${a?.data_atendimento||ds}"><label>Observações deste atendimento</label><textarea id="an" class="field" rows="3">${esc(a?.nota||'')}</textarea><div class="grid2"><div><label>Valor do serviço</label><input id="av" class="field" type="number" step=".01" value="${a?.valor_servico??a?.valor??c?.valor_servico??0}"></div><div><label>Situação</label><select id="as" class="field"><option value="green" ${a?.situacao==='green'?'selected':''}>🟢 Tudo certo</option><option value="yellow" ${a?.situacao==='yellow'?'selected':''}>🟡 Atenção</option><option value="red" ${a?.situacao==='red'?'selected':''}>🔴 Urgente</option></select></div></div><label><input id="ap" type="checkbox" ${a?.pago?'checked':''}> Serviço pago</label><h3 style="margin-top:18px">👷 Ajudantes neste atendimento</h3><div id="helperFields">${helperFields(a)}</div><button class="btn alt" onclick="addHelperRow()">＋ Incluir outro ajudante</button><h3 style="margin-top:18px">📸 Últimas fotos do cliente</h3><div id="apptPhotos" class="photoGrid">${p.map(x=>`<div class="photo"><img src="${x.imagem_data}" alt="foto"><div class="small">${esc(x.descricao||'Sem descrição')}</div></div>`).join('')||'<span class="muted">Nenhuma foto cadastrada.</span>'}</div><button class="btn" style="margin-top:16px" onclick="saveAppt(${a?a.id:'null'})">Salvar atendimento</button>`);window.currentApptPhotos=p;window.refreshApptClient=refreshApptClient;refreshApptClient()}
window.addHelperRow=()=>{let box=$('helperFields'),n=box.querySelectorAll('.helperItem').length+1;if(n>5)return alert('Máximo de 5 ajudantes por atendimento.');box.insertAdjacentHTML('beforeend',`<div class="helperRow helperItem"><div><label>Ajudante</label><select id="hid${n}" class="field"><option value="">Nenhum</option>${helperList.map(h=>`<option value="${h.id}">${esc(h.nome)}</option>`).join('')}</select></div><div><label>Valor do dia</label><input id="hval${n}" class="field" type="number" step=".01" value="0"></div><button class="btn danger remove" onclick="removeHelperRow(this)">− Remover</button></div>`) };
async function refreshApptClient(){let c=clients.find(x=>x.id==$('ac').value);if(!c)return;let p=await getPhotos(c.id);$('clientPreview').innerHTML=`<div class="panel"><div class="infoLine"><b>Endereço:</b> ${esc(c.endereco||'Não cadastrado')}</div><div class="infoLine"><b>Serviço:</b> ${esc(c.servico_principal||'')}</div><div class="infoLine"><b>Observações:</b> ${esc(c.observacoes||'')}</div></div>`;$('apptPhotos').innerHTML=p.map(x=>`<div class="photo"><img src="${x.imagem_data}" alt="foto"><div class="small">${esc(x.descricao||'Sem descrição')}</div></div>`).join('')||'<span class="muted">Nenhuma foto cadastrada.</span>'}
window.saveAppt=async id=>{let p={cliente_id:Number($('ac').value),data_atendimento:$('ad').value,valor_servico:Number($('av').value||0),valor:Number($('av').value||0),situacao:$('as').value,nota:$('an').value,pago:$('ap').checked,pago_em:$('ap').checked?new Date().toISOString():null};for(let i=1;i<=5;i++){let s=$('hid'+i),v=$('hval'+i);p['ajudante_'+i+'_id']=s?.value?Number(s.value):null;p['ajudante_'+i+'_valor']=Number(v?.value||0)}let r=id?await db.from('atendimentos').update(p).eq('id',id):await db.from('atendimentos').insert({...p,responsavel_id:me.id});if(r.error)return alert(r.error.message);closeModal();await loadData();agenda()};
function clientPage(){$('content').innerHTML=`<div class="toolbar"><h2>👤 Clientes</h2><button class="btn" onclick="openClient()">+ Cadastrar cliente</button></div><div class="panel"><table class="table"><thead><tr><th>Cliente</th><th>Telefone</th><th>Serviço</th><th>Ações</th></tr></thead><tbody>${clients.map(c=>`<tr><td><b>${esc(c.nome)}</b></td><td>${esc(c.telefone||'')}</td><td>${esc(c.servico_principal||'')}</td><td class="clientActions"><button class="btn alt" onclick="viewClient(${c.id})">Visualizar</button><button class="btn" onclick="openClient(${c.id})">Editar</button><button class="btn alt" onclick="openAnnual(${c.id})">🗓️ Anual</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum cliente cadastrado.</td></tr>'}</tbody></table></div>`}
window.viewClient=async id=>{let c=clients.find(x=>x.id===id),p=await getPhotos(id),pa=appts.filter(a=>a.cliente_id===id),hs=[];pa.forEach(a=>{for(let i=1;i<=5;i++){let hid=a['ajudante_'+i+'_id'];if(hid){let h=helperList.find(x=>x.id==hid);if(h)hs.push(h.nome)}}});let map=c.endereco?`<a class="btn alt" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.endereco)}" target="_blank">🗺️ Abrir mapa</a>`:'';let wa=c.telefone?`<a class="btn alt" href="https://wa.me/55${c.telefone.replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:'';openModal(`<h2>👤 ${esc(c.nome)}</h2><div class="panel"><div class="infoLine"><b>Telefone:</b> ${esc(c.telefone||'Não cadastrado')}</div><div class="infoLine"><b>Endereço:</b> ${esc(c.endereco||'Não cadastrado')}</div><div class="infoLine"><b>Serviço principal:</b> ${esc(c.servico_principal||'')}</div><div class="infoLine"><b>Valor padrão:</b> ${money(c.valor_servico)}</div><div class="infoLine"><b>Observações:</b> ${esc(c.observacoes||'')}</div></div><div class="row">${map}${wa}<button class="btn" onclick="closeModal();openClient(${id})">Editar</button></div><h3 style="margin-top:18px">👷 Ajudantes usados</h3><p>${[...new Set(hs)].map(esc).join(', ')||'Nenhum ajudante registrado.'}</p><h3>📸 Fotos</h3><div class="photoGrid">${p.map(x=>`<div class="photo"><img src="${x.imagem_data}"><div class="small">${esc(x.descricao||'Sem descrição')}</div></div>`).join('')||'<span class="muted">Nenhuma foto.</span>'}</div>`)};
window.openClient=async function(id=null){let c=id?clients.find(x=>x.id===id):null,p=id?await getPhotos(id):[];openModal(`<h2>${c?'Editar cliente':'Cadastrar cliente'}</h2><div class="grid2"><div><label>Nome completo</label><input id="cn" class="field" value="${esc(c?.nome||'')}"></div><div><label>Telefone / WhatsApp</label><input id="ct" class="field" value="${esc(c?.telefone||'')}"></div></div><label>Endereço completo</label><input id="ce" class="field" value="${esc(c?.endereco||'')}"><label>Serviço principal</label><input id="cs" class="field" value="${esc(c?.servico_principal||'')}"><div class="grid2"><div><label>Valor padrão do serviço</label><input id="cv" class="field" type="number" step=".01" value="${c?.valor_servico||0}"></div><div><label>Link/Referência de mapa</label><input id="cm" class="field" value="${esc(c?.mapa_url||'')}"></div></div><label>Observações / detalhes do cliente</label><textarea id="co" class="field" rows="4">${esc(c?.observacoes||'')}</textarea><h3 style="margin-top:18px">📸 Fotos do cliente</h3><input id="photoInput" class="field" type="file" accept="image/*" capture="environment"><label>Descrição da foto</label><input id="photoDesc" class="field" placeholder="Ex.: canteiro lateral após poda"><button class="btn alt" onclick="savePhoto(${id||'null'})">＋ Adicionar foto</button><div id="clientPhotos" class="photoGrid" style="margin-top:10px">${p.map(x=>`<div class="photo"><img src="${x.imagem_data}"><div class="small">${esc(x.descricao||'Sem descrição')}</div></div>`).join('')||'<span class="muted">Nenhuma foto cadastrada.</span>'}</div><button class="btn" style="margin-top:16px" onclick="saveClient(${c?c.id:'null'})">Salvar cliente</button>`)};
window.saveClient=async id=>{let p={nome:$('cn').value.trim(),telefone:$('ct').value,endereco:$('ce').value,servico_principal:$('cs').value,valor_servico:Number($('cv').value||0),mapa_url:$('cm').value,observacoes:$('co').value};if(!p.nome)return alert('Informe o nome.');let r=id?await db.from('clientes').update(p).eq('id',id):await db.from('clientes').insert(p);if(r.error)return alert(r.error.message);closeModal();await loadData();clientPage()};
window.savePhoto=async id=>{if(!id)return alert('Salve o cliente primeiro.');let f=$('photoInput').files[0];if(!f)return alert('Escolha ou tire uma foto.');let rd=new FileReader();rd.onload=async()=>{let r=await db.from('cliente_fotos').insert({cliente_id:id,imagem_data:rd.result,descricao:$('photoDesc').value});if(r.error)return alert(r.error.message);openClient(id)};rd.readAsDataURL(f)};
function helpersPage(){let d=new Date(),day=(d.getDay()+6)%7,mon=new Date(d);mon.setDate(d.getDate()-day);let fri=new Date(mon);fri.setDate(mon.getDate()+4),w1=iso(mon),w2=iso(fri),tot={};appts.filter(a=>a.data_atendimento>=w1&&a.data_atendimento<=w2).forEach(a=>{for(let i=1;i<=5;i++){let hid=a['ajudante_'+i+'_id'],v=Number(a['ajudante_'+i+'_valor']||0);if(hid){let h=helperList.find(x=>x.id==hid);if(h)tot[h.id]=(tot[h.id]||0)+v}}});$('content').innerHTML=`<div class="toolbar"><h2>👷 Ajudantes</h2><button class="btn" onclick="openHelper()">+ Cadastrar ajudante</button></div><div class="panel"><h3>💵 Pagamento desta semana</h3>${helperList.map(h=>`<div class="row infoLine"><b>${esc(h.nome)}</b><span class="right"><b>${money(tot[h.id]||0)}</b></span></div>`).join('')||'<p class="muted">Nenhum ajudante cadastrado.</p>'}</div><div class="panel"><h3>Cadastro de ajudantes</h3>${helperList.map(h=>`<div class="row infoLine"><span>👷 <b>${esc(h.nome)}</b> · ${esc(h.telefone||'')}</span><button class="btn alt right" onclick="openHelper(${h.id})">Editar</button></div>`).join('')||'<p class="muted">Cadastre os ajudantes que trabalham com você.</p>'}</div>`}
window.openHelper=async id=>{let h=id?helperList.find(x=>x.id===id):null;openModal(`<h2>${h?'Editar':'Cadastrar'} ajudante</h2><label>Nome</label><input id="hn" class="field" value="${esc(h?.nome||'')}"><label>Telefone / WhatsApp</label><input id="ht" class="field" value="${esc(h?.telefone||'')}"><label>Chave Pix (opcional)</label><input id="hp" class="field" value="${esc(h?.pix||'')}"><label>Observações</label><textarea id="ho" class="field">${esc(h?.observacoes||'')}</textarea><button class="btn" onclick="saveHelper(${h?h.id:'null'})">Salvar ajudante</button>`)};
window.saveHelper=async id=>{let p={nome:$('hn').value.trim(),telefone:$('ht').value,pix:$('hp').value,observacoes:$('ho').value,ativo:true};if(!p.nome)return alert('Informe o nome.');let r=id?await db.from('ajudantes').update(p).eq('id',id):await db.from('ajudantes').insert(p);if(r.error)return alert(r.error.message);closeModal();await loadData();helpersPage()};

function annualPage(){let year=new Date().getFullYear();$('content').innerHTML=`<div class="toolbar"><h2>🗓️ Agenda Anual</h2><span class="muted">${year}</span></div><div class="panel"><p class="muted">Escolha um cliente para montar o calendário anual. As datas salvas aparecem automaticamente na Agenda principal.</p>${clients.map(c=>`<div class="row infoLine"><b>${esc(c.nome)}</b><span class="right"><button class="btn alt" onclick="openAnnual(${c.id},${year})">Abrir agenda anual</button></span></div>`).join('')||'<p class="muted">Cadastre clientes primeiro.</p>'}</div>`}
function monthDateFor(year,month,day){let last=new Date(year,month+1,0).getDate();return new Date(year,month,Math.min(day,last))}
window.openAnnual=async function(cid,year=new Date().getFullYear()){let c=clients.find(x=>x.id===cid),rows=annuals.filter(x=>x.cliente_id===cid&&Number(x.ano)===Number(year));let byMonth={};rows.forEach(x=>{let d=new Date(x.data_agendada+'T12:00:00');(byMonth[d.getMonth()]??=[]).push(d.getDate())});let months=[];for(let m=0;m<12;m++){let first=new Date(year,m,1),days=new Date(year,m+1,0).getDate(),start=first.getDay(),cells=[];for(let i=0;i<start;i++)cells.push('<span></span>');for(let d=1;d<=days;d++)cells.push(`<span class="${(byMonth[m]||[]).includes(d)?'markDate':''}">${d}</span>`);months.push(`<div class="annualMonth"><h4>${new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(first)}</h4><div class="miniCal"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>${cells.join('')}</div></div>`)}openModal(`<h2>🗓️ Agenda anual — ${esc(c.nome)}</h2><div class="grid2"><div><label>Ano</label><input id="ay" class="field" type="number" value="${year}"></div><div><label>Data inicial</label><input id="a0" class="field" type="date"></div></div><div class="panel"><label>Adicionar uma data específica</label><div class="row"><input id="adate" class="field" type="date" style="flex:1"><button class="btn" onclick="addAnnualDate(${cid})">＋ Adicionar</button></div><p class="muted small">Você pode adicionar quantas datas quiser, inclusive vários clientes no mesmo dia.</p></div><div class="panel"><label>Repetir mensalmente</label><div class="row"><input id="aday" class="field" type="number" min="1" max="31" placeholder="Dia do mês"><button class="btn alt" onclick="repeatAnnual(${cid})">🔁 Preencher 12 meses</button></div></div><div class="annualGrid">${months.join('')}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="printAnnualImage(${cid},${year})">🖨️ Imprimir agenda anual</button><button class="btn alt" onclick="closeModal();annualPage()">Voltar</button></div>`)};
window.addAnnualDate=async cid=>{let date=$('adate').value;if(!date)return alert('Escolha uma data.');let year=Number(date.slice(0,4));let r=await db.from('agendas_anuais').upsert({cliente_id:cid,ano:year,data_agendada:date,criado_por:me.id},{onConflict:'cliente_id,data_agendada'});if(r.error)return alert(r.error.message);await loadData();openAnnual(cid,year)};
window.repeatAnnual=async cid=>{let day=Number($('aday').value),year=Number($('ay').value);if(!day||day<1||day>31)return alert('Informe um dia entre 1 e 31.');let rows=[];for(let m=0;m<12;m++){let d=monthDateFor(year,m,day),ds=iso(d);rows.push({cliente_id:cid,ano:year,data_agendada:ds,criado_por:me.id})}let r=await db.from('agendas_anuais').upsert(rows,{onConflict:'cliente_id,data_agendada'});if(r.error)return alert(r.error.message);await loadData();openAnnual(cid,year)};
window.printAnnualImage=async function(cid,year){let c=clients.find(x=>x.id===cid),dates=annuals.filter(x=>x.cliente_id===cid&&Number(x.ano)===Number(year)).map(x=>x.data_agendada);let cv=document.createElement('canvas'),W=1600,H=1100,ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#166534';ctx.font='bold 38px Arial';ctx.fillText(`Agenda anual — ${c?.nome||''}`,55,58);ctx.fillStyle='#555';ctx.font='20px Arial';ctx.fillText(String(year),55,92);let gx=35,gy=125,cw=380,ch=300,gap=15,names=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];for(let m=0;m<12;m++){let x=gx+(m%4)*(cw+gap),y=gy+Math.floor(m/4)*(ch+gap);ctx.strokeStyle='#dce5df';ctx.strokeRect(x,y,cw,ch);ctx.fillStyle='#172018';ctx.font='bold 21px Arial';ctx.fillText(names[m],x+15,y+30);ctx.font='14px Arial';['D','S','T','Q','Q','S','S'].forEach((n,i)=>ctx.fillText(n,x+20+i*50,y+55));let first=new Date(year,m,1).getDay(),last=new Date(year,m+1,0).getDate();for(let d=1;d<=last;d++){let idx=first+d-1,col=idx%7,row=Math.floor(idx/7),px=x+20+col*50,py=y+83+row*31,ds=iso(new Date(year,m,d));if(dates.includes(ds)){ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(px,py-5,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff'}else ctx.fillStyle='#172018';ctx.font='14px Arial';ctx.fillText(String(d),px-4,py)}}let url=cv.toDataURL('image/png'),w=window.open('','_blank');if(!w)return alert('Permita pop-ups para imprimir.');w.document.write(`<html><head><title>Agenda anual</title><style>body{margin:0;background:#fff;text-align:center}img{max-width:100%;height:auto}@media print{@page{size:A4 landscape;margin:5mm}img{width:100%}}@media(max-width:760px){.annualGrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.day{min-height:105px}}
</style></head><body><img src="${url}" onload="setTimeout(()=>window.print(),300)"></body></html>`);w.document.close()};
function financePage(){let y=month.getFullYear(),m=month.getMonth(),arr=appts.filter(a=>{let d=new Date(a.data_atendimento+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m}),earned=arr.reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0),received=arr.filter(a=>a.pago).reduce((s,a)=>s+Number(a.valor_servico??a.valor??0),0),help=arr.reduce((s,a)=>s+[1,2,3,4,5].reduce((z,i)=>z+Number(a['ajudante_'+i+'_valor']||0),0),0);$('content').innerHTML=`<div class="toolbar"><h2>💰 Financeiro</h2></div><div class="stats"><div class="stat">Serviços no mês<b>${money(earned)}</b></div><div class="stat">Recebido<b>${money(received)}</b></div><div class="stat">Ajudantes<b>${money(help)}</b></div></div><div class="panel"><b>Líquido após ajudantes: ${money(earned-help)}</b></div>`}
function usersPage(){if(profile?.perfil!=='master')return tab('inicio');db.from('profiles').select('id,nome,ativo,perfil').order('nome').then(r=>{$('content').innerHTML=`<div class="toolbar"><h2>👥 Usuários</h2></div><div class="panel"><table class="table"><tr><th>Nome</th><th>Perfil</th><th>Ativo</th></tr>${(r.data||[]).map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.perfil==='master'?'👑 Master':'Usuário'}</td><td>${x.ativo?'Sim':'Não'}</td></tr>`).join('')}</table></div>`})}
boot();
</script></body></html>
