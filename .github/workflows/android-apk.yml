name: Build CS Jardinagem APK
# Build atual solicitado pelo Carlos

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Preparar aplicativo local
        run: npm run prepare:android

      - name: Criar projeto Android
        run: npx cap add android

      - name: Adicionar ponte nativa de impressão Android
        run: |
          mkdir -p android/app/src/main/java/com/csjardinagem/app
          cat > android/app/src/main/java/com/csjardinagem/app/MainActivity.java <<'JAVA'
          package com.csjardinagem.app;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Build;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printWebView;

              @Override
              public void onStart() {
                  super.onStart();

                  // V40.20: use the real Android system-bar inset.
                  // Do not simulate the status-bar area with HTML padding.
                  final WebView webView = getBridge().getWebView();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      webView.setOnApplyWindowInsetsListener((v, insets) -> {
                          int top = 0;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              top = insets.getInsets(WindowInsets.Type.statusBars()).top;
                          } else {
                              int id = getResources().getIdentifier("status_bar_height", "dimen", "android");
                              if (id > 0) top = getResources().getDimensionPixelSize(id);
                          }
                          v.setPadding(v.getPaddingLeft(), top, v.getPaddingRight(), v.getPaddingBottom());
                          return insets;
                      });
                      webView.requestApplyInsets();
                  }

                  // Give the system notification area its own fixed background.
                  try {
                      Window window = getWindow();
                      window.setStatusBarColor(Color.rgb(22, 101, 52));
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          window.getDecorView().setSystemUiVisibility(0);
                      }
                  } catch (Exception ignored) {
                  }

                  webView.addJavascriptInterface(new PrintBridge(this), "AndroidPrint");
              }

              private class PrintBridge {
                  private final Activity activity;
                  PrintBridge(Activity activity) { this.activity = activity; }

                  @JavascriptInterface
                  public void printHtml(final String html, final String title) {
                      activity.runOnUiThread(() -> {
                          try {
                              if (printWebView != null) {
                                  printWebView.stopLoading();
                                  printWebView.destroy();
                              }
                              printWebView = new WebView(activity);
                              printWebView.getSettings().setJavaScriptEnabled(false);
                              printWebView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      try {
                                          PrintManager pm = (PrintManager) activity.getSystemService(Context.PRINT_SERVICE);
                                          String jobName = (title == null || title.trim().isEmpty()) ? "CS Jardinagem" : title;
                                          PrintAttributes attrs = new PrintAttributes.Builder()
                                                  .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                  .build();
                                          pm.print(jobName, view.createPrintDocumentAdapter(jobName), attrs);
                                      } catch (Exception ignored) {
                                      }
                                  }
                              });
                              printWebView.loadDataWithBaseURL("https://csjardinagem.local/", html, "text/html", "UTF-8", null);
                          } catch (Exception ignored) {
                          }
                      });
                  }
              }
          }
          JAVA

      - name: Instalar conversor de ícones
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Aplicar ícone CS Jardinagem
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do rm -f android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rsvg-convert -w 48 -h 48 app/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 app/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 app/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 app/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 app/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Adicionar permissões Android de câmera e notificações
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          perms='    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          if 'android.permission.CAMERA' not in s:
              s=s.replace(marker,perms+marker,1)
          p.write_text(s)
          PY

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CS-Jardinagem-App-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
