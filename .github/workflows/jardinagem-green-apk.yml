name: Gerar APK Jardinagem Green

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "jardinagem-green/**"
      - ".github/workflows/jardinagem-green-apk.yml"

permissions:
  contents: read

jobs:
  build-green-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar aplicativo Jardinagem Green
        run: |
          mkdir -p build/www
          cp -R jardinagem-green/. build/www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.jardinagemgreen.app",
            "appName": "Jardinagem Green",
            "webDir": "build/www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npm install --no-save @capacitor/core@^8 @capacitor/android@^8 @capacitor/cli@^8

      - name: Criar plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK de teste
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jardinagem-Green-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
