name: Deploy CS Jardinagem site\non:\n  push:\n    branches: [main]\n    paths:\n      - 'site/**'\n      - '.github/workflows/site-pages.yml'\n      - 'logo_cs_jardinagem.jpg'\n      - 'icon.svg'\n  workflow_dispatch:\npermissions:\n  contents: read\n  pages: write\n  id-token: write\nconcurrency:\n  group: pages\n  cancel-in-progress: true\njobs:\n  deploy:\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/configure-pages@v5\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: site\n      - id: deployment\n        uses: actions/deploy-pages@v4\n