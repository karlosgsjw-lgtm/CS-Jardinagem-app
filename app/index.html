<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#166534"><link rel="manifest" href="./manifest.webmanifest"><title>CS Jardinagem</title>
<style>body{margin:0;background:#f3f7f4;font-family:Arial,sans-serif;color:#172018;min-height:100vh;display:grid;place-items:center}.card{width:min(92%,420px);box-sizing:border-box;background:#fff;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0002;text-align:center}.logo{font-size:34px;font-weight:800;color:#166534;margin-bottom:8px}.muted{color:#68736b}.field{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border:1px solid #dce5df;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#166534;color:#fff;font-weight:700;font-size:16px;margin-top:10px}</style></head>
<body><div class="card"><div class="logo">🌿 CS Jardinagem</div><p class="muted">Entre para acessar sua agenda.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="E-mail"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Senha"><button id="entrar" class="btn">Entrar</button><p id="msg" class="muted"></p></div>
<script>
(async function limparCacheAntigo(){
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   for(const reg of regs) await reg.unregister();
  }
  if('caches' in window){
   const keys=await caches.keys();
   for(const key of keys) await caches.delete(key);
  }
 }catch(e){}
})();
(function(){
const U='https://lttqucegcmzwfsnrtdyj.supabase.co',K='sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG',SK='csj_supabase_session_v2';
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
$('entrar').addEventListener('click',async function(){
 try{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){msg('Informe e-mail e senha.');return}
  msg('Entrando...');
  const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){msg(d.error_description||d.msg||d.message||'E-mail ou senha inválidos.');return}
  localStorage.setItem(SK,JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token,expires_in:d.expires_in,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:d.token_type||'bearer',user:d.user}));
  msg('Login realizado. Abrindo agenda...');
  location.href='./main.html?v=20260929-1';
 }catch(e){msg('Erro de conexão: '+(e&&e.message||e))}
});
})();
</script></body></html>
