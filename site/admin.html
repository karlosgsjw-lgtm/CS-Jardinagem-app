<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | CS Jardinagem</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>.admin{max-width:1100px;margin:35px auto;padding:0 18px}.login,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 12px 35px #0a4d3010}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.list{display:flex;flex-direction:column;gap:8px}.item{padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.item.new{border-left:5px solid #e39b19}.item.active{background:#edf8f1}.small{font-size:12px;color:#71817a}.messages{height:350px;overflow:auto;border:1px solid var(--line);padding:15px;border-radius:12px}.m{margin:8px 0;padding:10px;border-radius:12px;background:#eef5f1}.me{background:#087f4b;color:#fff;margin-left:20%}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools a,.tools button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:750}.logout{float:right}@media(max-width:800px){.grid{grid-template-columns:1fr}.messages{height:280px}}</style></head><body><header><a class="brand" href="index.html"><img src="../logo_cs_jardinagem.jpg"></a><strong style="margin-right:auto">Painel de orçamentos</strong><button id="logout" class="logout" style="display:none">Sair</button></header><main class="admin"><section id="login" class="login"><h2>Acesso da CS Jardinagem</h2><p>Entre com um dos usuários master já cadastrados no sistema.</p><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button id="entrar" class="btn primary" style="margin-top:12px">Entrar</button><p id="loginMsg"></p></section><section id="app" style="display:none"><div class="grid"><div class="panel"><h3>Pedidos</h3><div id="list" class="list"></div></div><div class="panel"><div id="detail"><p>Selecione um pedido.</p></div></div></div></section></main><script>const S=window.supabase.createClient('https://lttqucegcmzwfsnrtdyj.supabase.co','sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG');let pedidos=[],current=null;const $=id=>document.getElementById(id);async function auth(){const {data}=await S.auth.getSession();if(data.session)showApp()}function showApp(){$('login').style.display='none';$('app').style.display='block';$('logout').style.display='block';load()}$('entrar').onclick=async()=>{const {error}=await S.auth.signInWithPassword({email:$('email').value,password:$('senha').value});if(error)$('loginMsg').textContent=error.message;else showApp()};$('logout').onclick=()=>S.auth.signOut().then(()=>location.reload());async function load(){const {data,error}=await S.from('site_orcamentos').select('*').order('criado_em',{ascending:false});if(error){$('list').innerHTML='<p>'+error.message+'</p>';return}pedidos=data||[];renderList()}function renderList(){$('list').innerHTML='';pedidos.forEach(p=>{const d=document.createElement('div');d.className='item '+(p.status==='novo'?'new':'');d.innerHTML='<strong>'+p.nome+'</strong><div class="small">'+p.telefone+' · '+new Date(p.criado_em).toLocaleString('pt-BR')+'</div><div class="small">'+p.status+'</div>';d.onclick=()=>open(p);$('list').appendChild(d)})}async function open(p){current=p;const {data:ms}=await S.from('site_mensagens').select('*').eq('orcamento_id',p.id).order('criado_em');const {data:fs}=await S.from('site_orcamento_arquivos').select('*').eq('orcamento_id',p.id).order('criado_em');$('detail').innerHTML='<h2>'+p.nome+'</h2><p>'+p.mensagem+'</p><p class="small">'+p.telefone+' '+(p.email||'')+'</p><div class="tools"><a target="_blank" href="https://wa.me/55'+p.telefone.replace(/\\D/g,'')+'">WhatsApp</a><a href="tel:'+p.telefone+'">Ligar</a>'+(p.email?'<a href="mailto:'+p.email+'">E-mail</a>':'')+'</div><h3>Fotos enviadas</h3><div class="preview">'+(fs||[]).map(f=>'<a target="_blank" href="'+f.url+'"><img src="'+f.url+'"></a>').join('')+'</div><h3>Conversa</h3><div id="msgs" class="messages">'+(ms||[]).map(m=>'<div class="m '+(m.autor_tipo==='empresa'?'me':'')+'"><strong>'+m.autor_nome+'</strong><br>'+m.mensagem+'</div>').join('')+'</div><form id="reply"><textarea id="replyText" rows="3" placeholder="Responder pelo chat do site..."></textarea><button class="btn primary">Enviar resposta</button></form>';document.getElementById('reply').onsubmit=sendReply;await S.from('site_orcamentos').update({status:'em_andamento',atualizado_em:new Date().toISOString()}).eq('id',p.id);p.status='em_andamento';renderList()}async function sendReply(e){e.preventDefault();const text=$('replyText').value.trim();if(!text)return;const {data:u}=await S.auth.getUser();const {data:prof}=await S.from('profiles').select('nome').eq('id',u.user.id).single();const {error}=await S.from('site_mensagens').insert({orcamento_id:current.id,autor_tipo:'empresa',autor_nome:prof?.nome||'CS Jardinagem',mensagem:text});if(!error)open(current)}S.channel('site-orcamentos-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'site_orcamentos'},p=>{if(p.new){load();if(Notification.permission==='granted')new Notification('Novo orçamento - CS Jardinagem',{body:p.new.nome+' enviou uma solicitação.'})}}).subscribe();S.channel('site-mensagens-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'site_mensagens'},p=>{if(current&&p.new.orcamento_id===current.id)open(current)}).subscribe();if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();auth();</script></body></html>
