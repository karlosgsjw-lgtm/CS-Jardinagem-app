<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de orçamentos | CS Jardinagem</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1150px;margin:35px auto;padding:0 18px}.login,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 12px 35px #0a4d3010}.grid{display:grid;grid-template-columns:350px 1fr;gap:18px}.list{display:flex;flex-direction:column;gap:8px;max-height:650px;overflow:auto}.item{padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.item.new{border-left:5px solid #e39b19}.item.active{background:#edf8f1}.small{font-size:12px;color:#71817a}.messages{min-height:180px;max-height:350px;overflow:auto;border:1px solid var(--line);padding:15px;border-radius:12px}.m{margin:8px 0;padding:10px;border-radius:12px;background:#eef5f1}.me{background:#087f4b;color:#fff;margin-left:20%}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools a,.tools button{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:750;text-decoration:none;color:inherit;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 9px;border-radius:99px;background:#b42318;color:#fff;font-weight:800}.photos{display:flex;gap:10px;flex-wrap:wrap}.photos img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.galleryAdmin{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.galleryCard{width:150px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.galleryCard img{width:100%;height:105px;object-fit:cover;display:block}.galleryCard .gaBody{padding:8px}.galleryCard button{width:100%;border:0;border-radius:8px;padding:7px;background:#fee2e2;color:#991b1b;font-weight:800;cursor:pointer}.galleryUpload{border:2px dashed #a7c9b8;border-radius:12px;padding:16px;text-align:center;color:#087f4b;margin-top:12px}.galleryUpload input{margin-top:8px}.statusbox{padding:12px;border-radius:12px;background:#f6faf8;margin:12px 0}.logout{float:right}@media(max-width:800px){.grid{grid-template-columns:1fr}.list{max-height:350px}.photos img{width:105px;height:85px}}</style></head><body><header><a class="brand" href="index.html"><img src="logo_cs_jardinagem.jpg" alt="CS Jardinagem"></a><strong style="margin-right:auto">Painel de orçamentos</strong><button id="logout" class="logout" style="display:none">Sair</button></header><main class="admin"><section id="login" class="login"><h2>Acesso da CS Jardinagem</h2><p>Entre com um dos usuários master já cadastrados no sistema.</p><input id="email" type="email" placeholder="E-mail"><input id="senha" type="password" placeholder="Senha"><button id="entrar" class="btn primary" style="margin-top:12px">Entrar</button><p id="loginMsg"></p></section><section id="app" style="display:none"><div class="grid"><div class="panel"><div class="top"><h3>Pedidos</h3><span id="newCount" class="badge">0</span></div><p class="small">Atualização automática a cada 10 segundos.</p><div id="list" class="list"></div></div><div class="panel"><div id="detail"><p>Selecione um pedido.</p></div></div></div><div class="panel" style="margin-top:18px"><div class="top"><div><h3>🌿 Galeria do site</h3><div class="small">Envie as fotos dos trabalhos que aparecerão na página pública.</div></div></div><div class="galleryUpload"><b>📷 Adicionar fotos</b><br><input id="galleryFiles" type="file" accept="image/*" multiple><button id="galleryUploadBtn" class="btn primary" type="button" style="margin-top:10px">Enviar fotos para a galeria</button><p id="galleryMsg" class="small"></p></div><div id="galleryAdmin" class="galleryAdmin"></div></div></section></main><script>const SB_URL="https://lttqucegcmzwfsnrtdyj.supabase.co";const SB_KEY="sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG";let accessToken=localStorage.getItem("cs_admin_access");let pedidos=[];let current=null;let firstLoad=true;const $=id=>document.getElementById(id);function headers(){return{"apikey":SB_KEY,"Authorization":"Bearer "+accessToken,"Content-Type":"application/json"}}async function api(path,opt={}){const r=await fetch(SB_URL+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||j?.hint||"Erro ao comunicar com o servidor.");return j}async function login(){const email=$("email").value.trim(),senha=$("senha").value;if(!email||!senha){$("loginMsg").textContent="Informe e-mail e senha.";return}$("entrar").disabled=true;$("loginMsg").textContent="Entrando...";try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password:senha})});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.error_description||j?.msg||"E-mail ou senha inválidos.");accessToken=j.access_token;localStorage.setItem("cs_admin_access",accessToken);await showApp();if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch(e){$("loginMsg").textContent=e.message}finally{$("entrar").disabled=false}}async function showApp(){ $("login").style.display="none";$("app").style.display="block";$("logout").style.display="block";await load();await loadGalleryAdmin();setInterval(load,10000)}async function load(){try{const data=await api("/rest/v1/site_orcamentos?select=*&order=criado_em.desc");const oldIds=new Set(pedidos.map(p=>p.id));pedidos=data||[];const newOnes=pedidos.filter(p=>p.status==="novo"&&!oldIds.has(p.id));renderList();$("newCount").textContent=pedidos.filter(p=>p.status==="novo").length;if(!firstLoad&&newOnes.length&&"Notification"in window&&Notification.permission==="granted"){new Notification("Novo orçamento — CS Jardinagem",{body:newOnes.length===1?newOnes[0].nome+" enviou uma solicitação.":newOnes.length+" novos orçamentos recebidos."});}firstLoad=false;if(current){const fresh=pedidos.find(p=>p.id===current.id);if(fresh)current=fresh}}catch(e){if(String(e.message).toLowerCase().includes("jwt")){localStorage.removeItem("cs_admin_access");location.reload()}else $("list").innerHTML="<p>"+e.message+"</p>"}}function renderList(){$("list").innerHTML="";if(!pedidos.length){$("list").innerHTML="<p class='small'>Nenhum orçamento recebido ainda.</p>";return}pedidos.forEach(p=>{const d=document.createElement("div");d.className="item "+(p.status==="novo"?"new ":"")+(current&&current.id===p.id?"active":"");d.innerHTML="<strong>"+esc(p.nome)+"</strong><div class='small'>"+esc(p.telefone)+" · "+new Date(p.criado_em).toLocaleString("pt-BR")+"</div><div class='small'>"+esc(p.status.replace("_"," "))+"</div>";d.onclick=()=>openOrder(p);$("list").appendChild(d)})}function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}async function openOrder(p){current=p;renderList();$("detail").innerHTML="<p>Carregando pedido...</p>";try{const [ms,fs]=await Promise.all([api("/rest/v1/site_mensagens?select=*&orcamento_id=eq."+encodeURIComponent(p.id)+"&order=criado_em.asc"),api("/rest/v1/site_orcamento_arquivos?select=*&orcamento_id=eq."+encodeURIComponent(p.id)+"&order=criado_em.asc")]);$("detail").innerHTML="<div class='top'><div><h2>"+esc(p.nome)+"</h2><div class='small'>Recebido em "+new Date(p.criado_em).toLocaleString("pt-BR")+"</div></div><span class='badge' style='background:#087f4b'>"+esc(p.status.replace("_"," "))+"</span></div><div class='statusbox'><strong>Telefone:</strong> "+esc(p.telefone)+"<br><strong>E-mail:</strong> "+esc(p.email||"não informado")+"<br><strong>Pedido:</strong><br>"+esc(p.mensagem||"Sem descrição")+"</div><div class='tools'><a target='_blank' href='https://wa.me/55"+p.telefone.replace(/\\D/g,"")+"'>💬 WhatsApp</a><a href='tel:"+esc(p.telefone)+"'>📞 Ligar</a>"+(p.email?"<a href='mailto:"+esc(p.email)+"'>✉️ E-mail</a>":"")+"</div><h3>📷 Fotos enviadas ("+(fs||[]).length+")</h3><div class='photos'>"+(fs||[]).map(f=>"<a target='_blank' href='"+esc(f.url)+"'><img src='"+esc(f.url)+"' alt='"+esc(f.nome_arquivo)+"'></a>").join("")+"</div><h3>💬 Conversa</h3><div id='msgs' class='messages'>"+((ms||[]).length?(ms||[]).map(m=>"<div class='m "+(m.autor_tipo==="empresa"?"me":"")+"'><strong>"+esc(m.autor_nome)+"</strong><br>"+esc(m.mensagem)+"</div>").join(""):"<span class='small'>Ainda não há mensagens.</span>")+"</div><form id='reply'><textarea id='replyText' rows='3' placeholder='Responder pelo chat do site...' required></textarea><button class='btn primary full'>Enviar resposta</button></form>";$("reply").onsubmit=sendReply;if(p.status==="novo"){await api("/rest/v1/site_orcamentos?id=eq."+encodeURIComponent(p.id),{method:"PATCH",body:JSON.stringify({status:"em_andamento",atualizado_em:new Date().toISOString()})});p.status="em_andamento";$("newCount").textContent=pedidos.filter(x=>x.status==="novo").length;renderList()}}catch(e){$("detail").innerHTML="<p>"+e.message+"</p>"}}async function sendReply(e){e.preventDefault();const text=$("replyText").value.trim();if(!text)return;const b=e.currentTarget.querySelector("button");b.disabled=true;try{await api("/rest/v1/site_mensagens",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({orcamento_id:current.id,autor_tipo:"empresa",autor_nome:"CS Jardinagem",mensagem:text})});await openOrder(current)}catch(err){alert("Não foi possível enviar a resposta.")}finally{b.disabled=false}}$("entrar").onclick=login;$("senha").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("logout").onclick=()=>{localStorage.removeItem("cs_admin_access");location.reload()};if(accessToken)showApp().catch(()=>{localStorage.removeItem("cs_admin_access");location.reload()});
async function loadGalleryAdmin(){try{const data=await api("/rest/v1/site_galeria?select=*&order=ordem.asc,criado_em.desc");$("galleryAdmin").innerHTML=(data||[]).map(x=>"<div class='galleryCard'><img src='"+esc(x.url)+"' alt='"+esc(x.titulo||"Trabalho")+"' loading='lazy'><div class='gaBody'><div class='small'>"+esc(x.titulo||"Trabalho CS Jardinagem")+"</div><button type='button' onclick='deleteGallery("+x.id+",\""+String(x.caminho).replace(/"/g,"&quot;")+"\")'>Excluir</button></div></div>").join("")||"<p class='small'>Nenhuma foto cadastrada.</p>"}catch(e){$("galleryAdmin").innerHTML="<p>"+esc(e.message)+"</p>"}}
async function uploadGallery(){const input=$("galleryFiles"),msg=$("galleryMsg"),btn=$("galleryUploadBtn");if(!input.files.length){msg.textContent="Selecione pelo menos uma foto.";return}btn.disabled=true;msg.textContent="Enviando fotos...";try{let ordem=Date.now();for(const file of [...input.files]){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path="trabalhos/"+crypto.randomUUID()+"-"+safe;const sr=await fetch(SB_URL+"/storage/v1/object/site-galeria/"+path,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+accessToken,"Content-Type":file.type||"image/jpeg","x-upsert":"false"},body:file});if(!sr.ok)throw new Error("Não foi possível enviar "+file.name);const url=SB_URL+"/storage/v1/object/public/site-galeria/"+path;await api("/rest/v1/site_galeria",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({titulo:"Trabalho CS Jardinagem",url,caminho:path,ordem:ordem++})})}input.value="";msg.textContent="Fotos adicionadas à galeria.";await loadGalleryAdmin()}catch(e){msg.textContent=e.message||"Falha ao enviar fotos."}finally{btn.disabled=false}}
async function deleteGallery(id,path){if(!confirm("Excluir esta foto da galeria?"))return;try{await fetch(SB_URL+"/storage/v1/object/site-galeria/"+path.split("/").map(encodeURIComponent).join("/"),{method:"DELETE",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+accessToken}});await api("/rest/v1/site_galeria?id=eq."+encodeURIComponent(id),{method:"DELETE"});await loadGalleryAdmin()}catch(e){alert(e.message||"Não foi possível excluir a foto.")}}
</script></body></html>
