<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar orçamento | CS Jardinagem</title><link rel="stylesheet" href="style.css"><style>.chat{max-width:720px;margin:50px auto;padding:24px}.bubble{padding:12px 15px;border-radius:15px;background:#eef5f1;margin:9px 0;max-width:85%}.mine{margin-left:auto;background:#087f4b;color:#fff}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:#e4f3ea;color:#087f4b;font-weight:800;font-size:12px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><a class="brand" href="index.html"><img src="../logo_cs_jardinagem.jpg"></a><a class="wa" href="index.html#orcamento">Novo orçamento</a></header><main class="chat"><span class="eyebrow">ACOMPANHAMENTO</span><h1 id="title">Seu pedido</h1><span id="status" class="status">Carregando...</span><div id="messages" style="margin:25px 0"></div><form id="chatForm"><input id="nome" placeholder="Seu nome" required><textarea id="texto" rows="4" placeholder="Escreva sua mensagem..." required></textarea><button class="btn primary full">Enviar mensagem</button></form></main><script>const S=window.supabase.createClient('https://lttqucegcmzwfsnrtdyj.supabase.co','sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG');const token=new URLSearchParams(location.search).get('token');let pedido;async function load(){if(!token){document.getElementById('title').textContent='Link inválido';return}const {data,error}=await S.rpc('site_obter_pedido',{p_token:token});if(error){document.getElementById('title').textContent='Pedido não encontrado';return}pedido=data;document.getElementById('title').textContent='Olá, '+data.nome;document.getElementById('status').textContent=data.status.replace('_',' ');const box=document.getElementById('messages');box.innerHTML='';(data.mensagens||[]).forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m.autor_tipo==='cliente'?'mine':'');d.innerHTML='<strong>'+m.autor_nome+'</strong><br>'+m.mensagem;box.appendChild(d)})}document.getElementById('chatForm').addEventListener('submit',async e=>{e.preventDefault();const {error}=await S.rpc('site_enviar_mensagem',{p_token:token,p_nome:document.getElementById('nome').value,p_mensagem:document.getElementById('texto').value});if(!error){document.getElementById('texto').value='';load()}});load();setInterval(load,15000);</script></body></html>
