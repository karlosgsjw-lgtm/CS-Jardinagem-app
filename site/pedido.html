<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar orçamento | CS Jardinagem</title><link rel="stylesheet" href="style.css"><style>.chat{max-width:720px;margin:50px auto;padding:24px}.bubble{padding:12px 15px;border-radius:15px;background:#eef5f1;margin:9px 0;max-width:85%}.mine{margin-left:auto;background:#087f4b;color:#fff}.status{display:inline-block;padding:6px 10px;border-radius:99px;background:#e4f3ea;color:#087f4b;font-weight:800;font-size:12px;text-transform:capitalize}.info{margin:18px 0;padding:15px;border:1px solid #dbe9e1;border-radius:14px;background:#f8fcfa}.empty{color:#71817a}</style></head><body><header><a class="brand" href="index.html"><img src="../logo_cs_jardinagem.jpg" alt="CS Jardinagem"></a><a class="wa" href="index.html#orcamento">Novo orçamento</a></header><main class="chat"><span class="eyebrow">ACOMPANHAMENTO</span><h1 id="title">Seu pedido</h1><span id="status" class="status">Carregando...</span><div class="info">Aqui você pode acompanhar o andamento do seu orçamento e conversar diretamente com a <strong>CS Jardinagem</strong>.</div><div id="messages" style="margin:25px 0"></div><form id="chatForm"><input id="nome" placeholder="Seu nome" required><textarea id="texto" rows="4" placeholder="Escreva sua mensagem..." required></textarea><button class="btn primary full">Enviar mensagem</button></form></main><script>const SB_URL="https://lttqucegcmzwfsnrtdyj.supabase.co";const SB_KEY="sb_publishable_HQCcSkAZ1NcL4feTlkLBpw_PrirZRhG";const H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"};const token=new URLSearchParams(location.search).get("token");async function rpc(n,b){const r=await fetch(SB_URL+"/rest/v1/rpc/"+n,{method:"POST",headers:H,body:JSON.stringify(b)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||"Erro");return j}async function load(){if(!token){document.getElementById("title").textContent="Link inválido";return}try{const data=await rpc("site_obter_pedido",{p_token:token});document.getElementById("title").textContent="Olá, CS Jardinagem";document.getElementById("status").textContent=data.status.replace("_"," ");const box=document.getElementById("messages");box.innerHTML="";if(!(data.mensagens||[]).length)box.innerHTML='<p class="empty">Ainda não há mensagens. Quando a CS Jardinagem responder, a conversa aparecerá aqui.</p>';(data.mensagens||[]).forEach(m=>{const d=document.createElement("div");d.className="bubble "+(m.autor_tipo==="cliente"?"mine":"");d.innerHTML="<strong>"+m.autor_nome+"</strong><br>"+m.mensagem;box.appendChild(d)})}catch(e){document.getElementById("title").textContent="Pedido não encontrado";document.getElementById("status").textContent="verifique o link"}}document.getElementById("chatForm").addEventListener("submit",async e=>{e.preventDefault();const b=e.currentTarget.querySelector("button");b.disabled=true;try{await rpc("site_enviar_mensagem",{p_token:token,p_nome:document.getElementById("nome").value,p_mensagem:document.getElementById("texto").value});document.getElementById("texto").value="";await load()}catch(err){alert("Não foi possível enviar a mensagem.")}finally{b.disabled=false}});load();setInterval(load,15000);</script></body></html>
